<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dare System Controller</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

.status {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 20px;
    background: #333;
    font-weight: bold;
    margin-bottom: 20px;
}

.connected {
    background: #145c2a;
    color: #6dff99;
}

.disconnected {
    background: #5c1515;
    color: #ff7777;
}

.card {
    background: #15151c;
    border: 1px solid #292934;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #bbb;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #363642;
    background: #0d0d12;
    color: white;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #7777ff;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.send {
    background: #6c63ff;
    color: white;
    width: 100%;
}

.send:hover {
    background: #8179ff;
}

.accept {
    background: #1d8f4e;
    color: white;
}

.accept:hover {
    background: #25a85c;
}

.reject {
    background: #b52b2b;
    color: white;
}

.reject:hover {
    background: #d33a3a;
}

.complete {
    background: #1d8f4e;
    color: white;
}

.fail {
    background: #b52b2b;
    color: white;
}

.active-dare {
    border: 2px solid #6c63ff;
    background: #171625;
}

.dare-text {
    font-size: 25px;
    font-weight: bold;
    margin: 15px 0;
    line-height: 1.3;
}

.meta {
    color: #aaa;
    font-size: 14px;
    margin-top: 7px;
}

.timer {
    font-size: 42px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

.queue-item {
    background: #0e0e14;
    border: 1px solid #292934;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
}

.queue-item:hover {
    border-color: #44445a;
}

.queue-number {
    color: #7777ff;
    font-weight: bold;
    margin-right: 8px;
}

.queue-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.queue-buttons button {
    flex: 1;
    margin-top: 0;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.buttons button {
    flex: 1;
    min-width: 140px;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #22222c;
    border: 1px solid #444;
    padding: 12px 18px;
    border-radius: 10px;
    display: none;
    z-index: 9999;
}

.streamer-info {
    color: #aaa;
    margin-bottom: 15px;
}

.streamer-info strong {
    color: white;
}

.pending-label {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    background: #332b08;
    color: #facc15;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
}

.live-label {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    background: #145c2a;
    color: #6dff99;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 25px;
    }

    .dare-text {
        font-size: 21px;
    }

    .timer {
        font-size: 35px;
    }

    .queue-buttons {
        flex-direction: column;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>🎯 DARE SYSTEM</h1>

    <div
        id="connectionStatus"
        class="status disconnected"
    >
        🔴 Connecting...
    </div>


    <!-- STREAMER -->

    <div class="card">

        <h2>🎥 CONTROLLING STREAMER</h2>

        <div class="streamer-info">

            Streamer:
            <strong id="streamerName">
                Loading...
            </strong>

        </div>

        <select id="streamerSelect">

            <option value="">
                Loading streamers...
            </option>

        </select>

    </div>


    <!-- SEND TEST DARE -->

    <div class="card">

        <h2>➕ SEND TEST DARE</h2>

        <label>
            Viewer Name
        </label>

        <input
            id="viewerInput"
            type="text"
            placeholder="Viewer name"
            value="TestViewer"
        >

        <label>
            Dare Text
        </label>

        <textarea
            id="dareInput"
            placeholder="Enter the dare..."
        ></textarea>

        <label>
            Duration (seconds)
        </label>

        <input
            id="durationInput"
            type="number"
            min="5"
            max="300"
            value="30"
        >

        <label>
            Reward
        </label>

        <input
            id="rewardInput"
            type="number"
            min="0"
            step="0.01"
            value="0"
        >

        <button
            class="send"
            id="sendButton"
        >
            🚀 SEND DARE
        </button>

    </div>


    <!-- ACTIVE DARE -->

    <div class="card active-dare">

        <h2>🔥 ACTIVE DARE</h2>

        <div id="currentDare">

            <div class="empty">
                No active dare
            </div>

        </div>

    </div>


    <!-- WAITING QUEUE -->

    <div class="card">

        <h2>⏳ WAITING QUEUE</h2>

        <div id="queue">

            <div class="empty">
                No waiting dares
            </div>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://dare-backend-vx8w.onrender.com";

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* =========================================================
   STATE
========================================================= */

let ws = null;

let streamers = [];

let selectedStreamer = "IShowSloow_";

let activeDares = {};

let queues = {};

let currentDare = null;

let timerInterval = null;


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const streamerSelect =
    document.getElementById(
        "streamerSelect"
    );

const streamerName =
    document.getElementById(
        "streamerName"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const queueElement =
    document.getElementById(
        "queue"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const dareInput =
    document.getElementById(
        "dareInput"
    );

const viewerInput =
    document.getElementById(
        "viewerInput"
    );

const durationInput =
    document.getElementById(
        "durationInput"
    );

const rewardInput =
    document.getElementById(
        "rewardInput"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   HELPERS
========================================================= */

function streamerKey(name) {

    return String(name || "")
        .trim()
        .toLowerCase();

}


function dareText(dare) {

    return dare.dareText ||
           dare.dare_text ||
           "";

}


function showToast(message) {

    toast.textContent =
        message;

    toast.style.display =
        "block";

    setTimeout(() => {

        toast.style.display =
            "none";

    }, 2500);

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    try {

        ws =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(error);

        return;

    }


    ws.onopen = function() {

        connectionStatus.textContent =
            "🟢 Connected";

        connectionStatus.className =
            "status connected";


        ws.send(
            JSON.stringify({
                type: "GET_STATE"
            })
        );

    };


    ws.onclose = function() {

        connectionStatus.textContent =
            "🔴 Disconnected";

        connectionStatus.className =
            "status disconnected";


        setTimeout(
            connectWebSocket,
            3000
        );

    };


    ws.onerror = function(error) {

        console.error(
            "WebSocket error:",
            error
        );

        connectionStatus.textContent =
            "🔴 Connection Error";

        connectionStatus.className =
            "status disconnected";

    };


    ws.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );

                handleWebSocketMessage(
                    message
                );

            } catch (error) {

                console.error(
                    "WebSocket message error:",
                    error
                );

            }

        };

}


/* =========================================================
   WEBSOCKET MESSAGES
========================================================= */

function handleWebSocketMessage(
    message
) {

    console.log(
        "WebSocket:",
        message
    );


    /* =====================================================
       INITIAL STATE

       Backend sends:

       {
          type: "STATE",
          active: {...},
          queues: {...}
       }
    ===================================================== */

    if (
        message.type ===
        "STATE"
    ) {

        activeDares =
            message.active ||
            {};

        queues =
            message.queues ||
            {};

        renderStreamers();

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        return;

    }


    /* =====================================================
       NEW DARE
    ===================================================== */

    if (
        message.type ===
        "DARE_CREATED"
    ) {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }


        /*
           New dares ALWAYS begin as pending.

           They are NOT automatically accepted.
        */

        updateQueueFromDare(
            dare
        );

        renderQueue();

        showToast(
            "🟡 New dare received!"
        );

        return;

    }


    /* =====================================================
       ACTIVE DARE
    ===================================================== */

    if (
        message.type ===
        "ACTIVE_DARE"
    ) {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }


        const key =
            streamerKey(
                dare.streamer
            );


        activeDares[key] =
            dare;


        removeFromQueue(
            dare.id
        );


        if (
            streamerKey(
                dare.streamer
            ) ===
            streamerKey(
                selectedStreamer
            )
        ) {

            currentDare =
                dare;

            renderCurrentDare();

        }


        renderQueue();

        showToast(
            "🔥 Dare ACCEPTED and is now LIVE!"
        );

        return;

    }


    /* =====================================================
       QUEUE UPDATED
    ===================================================== */

    if (
        message.type ===
        "QUEUE_UPDATED"
    ) {

        const key =
            streamerKey(
                message.streamer
            );


        queues[key] =
            message.queue ||
            [];


        renderQueue();

        return;

    }


    /* =====================================================
       COMPLETED
    ===================================================== */

    if (
        message.type ===
        "DARE_COMPLETED"
    ) {

        const dare =
            message.dare;

        removeActiveDare(
            dare
        );

        showToast(
            "✅ Dare completed!"
        );

        return;

    }


    /* =====================================================
       FAILED
    ===================================================== */

    if (
        message.type ===
        "DARE_FAILED"
    ) {

        const dare =
            message.dare;

        removeActiveDare(
            dare
        );

        showToast(
            "❌ Dare failed!"
        );

        return;

    }


    /* =====================================================
       ACTIVE CLEARED
    ===================================================== */

    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        /*
           Backend currently sends the streamer,
           not the dare object.
        */

        const key =
            streamerKey(
                message.streamer
            );


        delete activeDares[key];


        if (
            key ===
            streamerKey(
                selectedStreamer
            )
        ) {

            currentDare =
                null;

            stopTimer();

        }


        renderCurrentDare();

        renderQueue();

        return;

    }


    /* =====================================================
       REJECTED
    ===================================================== */

    if (
        message.type ===
        "DARE_REJECTED"
    ) {

        const dare =
            message.dare;

        if (dare) {

            removeFromQueue(
                dare.id
            );

        }


        renderQueue();

        showToast(
            "❌ Dare rejected."
        );

        return;

    }


    /* =====================================================
       RESET
    ===================================================== */

    if (
        message.type ===
        "RESET"
    ) {

        activeDares = {};

        queues = {};

        currentDare = null;

        stopTimer();

        renderCurrentDare();

        renderQueue();

        return;

    }

}


/* =========================================================
   STREAMERS
========================================================= */

async function loadStreamers() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/streamers"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load streamers"
            );

        }


        streamers =
            await response.json();


        renderStreamers();

    } catch (error) {

        console.error(
            error
        );


        streamers = [
            {
                username:
                    "IShowSloow_",

                displayName:
                    "IShowSloow_"
            }
        ];


        renderStreamers();

    }

}


function renderStreamers() {

    streamerSelect.innerHTML =
        "";


    if (!streamers.length) {

        streamerName.textContent =
            selectedStreamer;

        return;

    }


    streamers.forEach(
        streamer => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                streamer.username;


            option.textContent =
                streamer.displayName ||
                streamer.username;


            streamerSelect.appendChild(
                option
            );

        }
    );


    streamerSelect.value =
        selectedStreamer;


    streamerName.textContent =
        selectedStreamer;

}


/* =========================================================
   STREAMER CHANGE
========================================================= */

streamerSelect.addEventListener(
    "change",
    function() {

        selectedStreamer =
            streamerSelect.value;


        streamerName.textContent =
            selectedStreamer;


        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

    }
);


/* =========================================================
   SYNC SELECTED STREAMER
========================================================= */

function syncSelectedStreamer() {

    const key =
        streamerKey(
            selectedStreamer
        );


    currentDare =
        activeDares[key] ||
        null;

}


/* =========================================================
   ACTIVE DARE
========================================================= */

function removeActiveDare(
    dare
) {

    if (!dare) {
        return;
    }


    const key =
        streamerKey(
            dare.streamer
        );


    if (
        activeDares[key] &&
        activeDares[key].id ===
        dare.id
    ) {

        delete activeDares[key];

    }


    if (
        currentDare &&
        currentDare.id ===
        dare.id
    ) {

        currentDare =
            null;

        stopTimer();

    }


    renderCurrentDare();

    renderQueue();

}


/* =========================================================
   RENDER ACTIVE DARE
========================================================= */

function renderCurrentDare() {

    stopTimer();


    if (!currentDare) {

        currentDareElement.innerHTML = `

            <div class="empty">
                No active dare
            </div>

        `;

        return;

    }


    const dare =
        currentDare;


    currentDareElement.innerHTML = `

        <div class="live-label">
            🔴 LIVE
        </div>

        <div class="meta">
            Viewer:
            <strong>
                ${escapeHtml(
                    dare.viewer ||
                    "Anonymous"
                )}
            </strong>
        </div>

        <div class="dare-text">
            ${escapeHtml(
                dareText(dare)
            )}
        </div>

        <div class="meta">
            Reward:
            ₱${Number(
                dare.reward || 0
            ).toFixed(2)}
        </div>

        <div class="meta">
            Duration:
            ${Number(
                dare.duration || 0
            )} seconds
        </div>

        <div
            id="timer"
            class="timer"
        >
            ${formatTime(
                Number(
                    dare.duration || 0
                )
            )}
        </div>

        <div class="buttons">

            <button
                class="complete"
                onclick="
                    setDareStatus(
                        ${dare.id},
                        'completed'
                    )
                "
            >
                ✅ COMPLETED
            </button>

            <button
                class="fail"
                onclick="
                    setDareStatus(
                        ${dare.id},
                        'failed'
                    )
                "
            >
                ❌ FAILED / GIVE UP
            </button>

        </div>

    `;


    startTimer(
        dare
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(
    dare
) {

    stopTimer();


    let remaining =
        Number(
            dare.duration || 0
        );


    const timerElement =
        document.getElementById(
            "timer"
        );


    if (!timerElement) {
        return;
    }


    timerElement.textContent =
        formatTime(
            remaining
        );


    timerInterval =
        setInterval(
            () => {

                remaining--;


                if (
                    remaining < 0
                ) {

                    stopTimer();

                    timerElement.textContent =
                        "TIME!";

                    return;

                }


                timerElement.textContent =
                    formatTime(
                        remaining
                    );

            },
            1000
        );

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}


function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


/* =========================================================
   RENDER QUEUE
========================================================= */

function renderQueue() {

    const key =
        streamerKey(
            selectedStreamer
        );


    const queue =
        queues[key] ||
        [];


    if (!queue.length) {

        queueElement.innerHTML = `

            <div class="empty">
                No waiting dares
            </div>

        `;

        return;

    }


    queueElement.innerHTML =
        "";


    queue.forEach(
        (dare, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "queue-item";


            item.innerHTML = `

                <div class="pending-label">
                    🟡 PENDING
                </div>

                <div>

                    <span
                        class="queue-number"
                    >
                        #${index + 1}
                    </span>

                    <strong>
                        ${escapeHtml(
                            dareText(dare)
                        )}
                    </strong>

                </div>

                <div class="meta">

                    Viewer:
                    ${escapeHtml(
                        dare.viewer ||
                        "Anonymous"
                    )}

                </div>

                <div class="meta">

                    Duration:
                    ${Number(
                        dare.duration || 0
                    )}s

                    · Reward:
                    ₱${Number(
                        dare.reward || 0
                    ).toFixed(2)}

                </div>

                <div class="queue-buttons">

                    <button
                        class="accept"
                        onclick="
                            acceptDare(
                                ${dare.id}
                            )
                        "
                    >
                        ✅ ACCEPT
                    </button>

                    <button
                        class="reject"
                        onclick="
                            rejectDare(
                                ${dare.id}
                            )
                        "
                    >
                        ❌ REJECT
                    </button>

                </div>

            `;


            queueElement.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   QUEUE HELPERS
========================================================= */

function updateQueueFromDare(
    dare
) {

    if (
        !dare ||
        !dare.streamer
    ) {

        return;

    }


    /*
       Never put accepted dares
       into the queue.
    */

    if (
        dare.status ===
        "accepted"
    ) {

        removeFromQueue(
            dare.id
        );

        return;

    }


    const key =
        streamerKey(
            dare.streamer
        );


    if (!queues[key]) {

        queues[key] = [];

    }


    const exists =
        queues[key].some(
            item =>
                item.id ===
                dare.id
        );


    if (!exists) {

        queues[key].push(
            dare
        );

    }


    queues[key].sort(
        (a, b) => {

            const aDate =
                new Date(
                    a.createdAt ||
                    a.created_at ||
                    0
                );

            const bDate =
                new Date(
                    b.createdAt ||
                    b.created_at ||
                    0
                );

            return aDate - bDate;

        }
    );

}


function removeFromQueue(
    id
) {

    Object.keys(
        queues
    ).forEach(
        key => {

            queues[key] =
                (
                    queues[key] ||
                    []
                ).filter(
                    dare =>
                        dare.id !== id
                );

        }
    );

}


/* =========================================================
   ACCEPT DARE
========================================================= */

async function acceptDare(
    id
) {

    const dare =
        findDareInQueue(
            id
        );


    if (!dare) {

        showToast(
            "❌ Dare is no longer pending."
        );

        return;

    }


    /*
       IMPORTANT:

       Do not allow accepting another
       dare while one is already active.
    */

    const active =
        activeDares[
            streamerKey(
                dare.streamer
            )
        ];


    if (active) {

        showToast(
            "⚠️ Finish the active dare first."
        );

        return;

    }


    await setDareStatus(
        id,
        "accepted"
    );

}


function findDareInQueue(
    id
) {

    for (
        const key of
        Object.keys(queues)
    ) {

        const found =
            (
                queues[key] ||
                []
            ).find(
                dare =>
                    dare.id === id
            );


        if (found) {
            return found;
        }

    }


    return null;

}


/* =========================================================
   REJECT DARE
========================================================= */

async function rejectDare(
    id
) {

    await setDareStatus(
        id,
        "rejected"
    );

}


/* =========================================================
   SEND TEST DARE
========================================================= */

sendButton.addEventListener(
    "click",
    sendDare
);


async function sendDare() {

    const dareTextValue =
        dareInput.value.trim();


    const viewer =
        viewerInput.value.trim() ||
        "TestViewer";


    const duration =
        Number(
            durationInput.value
        );


    const reward =
        Number(
            rewardInput.value
        );


    if (!dareTextValue) {

        showToast(
            "⚠️ Enter a dare first."
        );

        dareInput.focus();

        return;

    }


    if (
        !Number.isFinite(duration) ||
        duration < 5 ||
        duration > 300
    ) {

        showToast(
            "⚠️ Duration must be 5–300 seconds."
        );

        return;

    }


    if (
        !Number.isFinite(reward) ||
        reward < 0
    ) {

        showToast(
            "⚠️ Reward cannot be negative."
        );

        return;

    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "⏳ SENDING...";


    try {

        const response =
            await fetch(
                API_URL +
                "/api/dare",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            streamer:
                                selectedStreamer,

                            streamer_source:
                                "twitch_username",

                            viewer:
                                viewer,

                            dare_text:
                                dareTextValue,

                            duration:
                                duration,

                            reward:
                                reward

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to send dare."
            );

        }


        dareInput.value =
            "";


        showToast(
            "🟡 Dare added to pending queue."
        );


    } catch (error) {

        console.error(
            "Send dare error:",
            error
        );


        showToast(
            "❌ " +
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "🚀 SEND DARE";

    }

}


/* =========================================================
   SET DARE STATUS
========================================================= */

async function setDareStatus(
    id,
    status
) {

    try {

        const response =
            await fetch(

                API_URL +
                "/api/dare/" +
                id +
                "/status",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                status

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to update dare."
            );

        }


        console.log(
            "Status updated:",
            data
        );


        /*
           The WebSocket will update
           the controller automatically.
        */

        if (
            status ===
            "accepted"
        ) {

            showToast(
                "🔥 Accepting dare..."
            );

        }


        if (
            status ===
            "rejected"
        ) {

            showToast(
                "❌ Rejecting dare..."
            );

        }


        if (
            status ===
            "completed"
        ) {

            showToast(
                "✅ Completing dare..."
            );

        }


        if (
            status ===
            "failed"
        ) {

            showToast(
                "❌ Failing dare..."
            );

        }


    } catch (error) {

        console.error(
            "Status error:",
            error
        );


        showToast(
            "❌ " +
            error.message
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    await loadStreamers();

    connectWebSocket();

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
