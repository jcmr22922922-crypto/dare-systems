<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dare System Controller</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #08080d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #aaa;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4444;
}

.dot.connected {
    background: #22c55e;
}

/* CARDS */

.card {
    background: #111118;
    border: 1px solid #252530;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
}

.card-title {
    color: #777;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 18px;
}

/* EMPTY */

.empty {
    text-align: center;
    color: #666;
    padding: 40px 15px;
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* DARE */

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 7px;
    background: #e53935;
    font-size: 10px;
    font-weight: 900;
    margin-bottom: 12px;
}

.viewer {
    color: #888;
    font-size: 14px;
    margin-bottom: 12px;
}

.viewer strong {
    color: white;
}

.dare-text {
    font-size: clamp(25px, 5vw, 40px);
    line-height: 1.15;
    font-weight: 900;
    margin-bottom: 18px;
    word-break: break-word;
}

.details {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.detail {
    background: #1b1b24;
    border-radius: 9px;
    padding: 9px 12px;
    color: #aaa;
    font-size: 12px;
    font-weight: 700;
}

.detail span {
    color: white;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    border-radius: 11px;
    padding: 15px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.accept {
    background: #22c55e;
    color: #031008;
}

.reject {
    background: #ef4444;
    color: white;
}

.complete {
    background: #3b82f6;
    color: white;
}

.failed {
    background: #9333ea;
    color: white;
}

/* QUEUE */

.queue-count {
    color: white;
    margin-left: 5px;
}

.queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #24242c;
}

.queue-item:last-child {
    border-bottom: none;
}

.queue-number {
    min-width: 30px;
    color: #777;
    font-weight: 900;
}

.queue-content {
    flex: 1;
}

.queue-viewer {
    color: #888;
    font-size: 11px;
    margin-bottom: 4px;
}

.queue-text {
    font-size: 14px;
    font-weight: 700;
}

.queue-reward {
    color: #aaa;
    font-size: 12px;
}

/* SECONDARY */

.secondary {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.secondary button {
    background: #1b1b24;
    color: #aaa;
    font-size: 11px;
    padding: 10px 13px;
}

/* TOAST */

#toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%, 20px);
    opacity: 0;
    background: #181820;
    border: 1px solid #30303a;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    transition: .2s;
    pointer-events: none;
}

#toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 18px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .secondary {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        🎯 DARE SYSTEM
    </div>

    <div class="connection">

        <div
            id="connectionDot"
            class="dot">
        </div>

        <span id="connectionText">
            Connecting...
        </span>

    </div>

</header>


<!-- CURRENT DARE -->

<div class="card">

    <div class="card-title">
        CURRENT DARE
    </div>


    <div
        id="emptyState"
        class="empty">

        <div class="empty-icon">
            🎯
        </div>

        No active dare

    </div>


    <div
        id="currentDare"
        style="display:none;">

        <div
            id="status"
            class="status">

            NEW

        </div>


        <div class="viewer">

            From:

            <strong id="viewer">
                @viewer
            </strong>

        </div>


        <div
            id="dareText"
            class="dare-text">
        </div>


        <div class="details">

            <div class="detail">

                💰 ₱<span id="reward">
                    0
                </span>

            </div>


            <div class="detail">

                ⏱️ <span id="duration">
                    30
                </span>s

            </div>

        </div>


        <!-- ACCEPT / REJECT -->

        <div
            id="decisionButtons"
            class="buttons">

            <button
                id="acceptButton"
                class="accept"
                onclick="setDareStatus('accepted')">

                ✅ ACCEPT

            </button>


            <button
                id="rejectButton"
                class="reject"
                onclick="setDareStatus('rejected')">

                ❌ REJECT

            </button>

        </div>


        <!-- COMPLETE / FAILED -->

        <div
            id="finishButtons"
            class="buttons"
            style="display:none; margin-top:10px;">

            <button
                class="complete"
                onclick="setDareStatus('completed')">

                🏁 COMPLETED

            </button>


            <button
                class="failed"
                onclick="setDareStatus('failed')">

                🚫 FAILED

            </button>

        </div>

    </div>

</div>


<!-- QUEUE -->

<div class="card">

    <div class="card-title">

        WAITING QUEUE

        <span
            id="queueCount"
            class="queue-count">

            0

        </span>

    </div>


    <div id="queueList">

        <div class="empty">

            No dares waiting

        </div>

    </div>


    <div class="secondary">

        <button onclick="refreshState()">
            🔄 Refresh
        </button>

        <button onclick="clearQueue()">
            🗑️ Clear All
        </button>

    </div>

</div>

</div>


<div id="toast"></div>


<script>

/* ==========================================
   BACKEND
========================================== */

const BACKEND_URL =
    "https://dare-backend-vx8w.onrender.com";

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* ==========================================
   STATE
========================================== */

let currentDare = null;

let dareQueue = [];

let socket = null;


/* ==========================================
   ELEMENTS
========================================== */

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const viewerElement =
    document.getElementById(
        "viewer"
    );

const dareTextElement =
    document.getElementById(
        "dareText"
    );

const rewardElement =
    document.getElementById(
        "reward"
    );

const durationElement =
    document.getElementById(
        "duration"
    );

const decisionButtons =
    document.getElementById(
        "decisionButtons"
    );

const finishButtons =
    document.getElementById(
        "finishButtons"
    );

const queueList =
    document.getElementById(
        "queueList"
    );

const queueCount =
    document.getElementById(
        "queueCount"
    );


/* ==========================================
   WEBSOCKET CONNECTION
========================================== */

function connectWebSocket() {

    connectionText.textContent =
        "Connecting...";

    connectionDot.classList.remove(
        "connected"
    );


    socket =
        new WebSocket(WS_URL);


    socket.onopen =
        function() {

            console.log(
                "Connected to Dare Server"
            );

            connectionText.textContent =
                "Connected";

            connectionDot.classList.add(
                "connected"
            );

        };


    socket.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );

                handleMessage(message);

            }

            catch(error) {

                console.error(
                    "Message error:",
                    error
                );

            }

        };


    socket.onclose =
        function() {

            connectionText.textContent =
                "Disconnected";

            connectionDot.classList.remove(
                "connected"
            );


            setTimeout(
                connectWebSocket,
                2000
            );

        };


    socket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

        };

}


/* ==========================================
   HANDLE SERVER MESSAGES
========================================== */

function handleMessage(message) {

    console.log(
        "Server:",
        message
    );


    if (
        message.type ===
        "STATE"
    ) {

        currentDare =
            message.currentDare;

        dareQueue =
            message.queue || [];

        render();

    }


    else if (
        message.type ===
        "NEW_DARE"
    ) {

        currentDare =
            message.dare;

        dareQueue =
            message.queue || [];

        render();

        showToast(
            "🎯 New dare!"
        );

    }


    else if (
        message.type ===
        "QUEUE_UPDATED"
    ) {

        currentDare =
            message.currentDare;

        dareQueue =
            message.queue || [];

        render();

    }


    else if (
        message.type ===
        "DARE_STATUS"
    ) {

        currentDare =
            message.dare;

        dareQueue =
            message.queue || [];

        render();

    }


    else if (
        message.type ===
        "DARE_CLEARED"
    ) {

        currentDare = null;

        dareQueue =
            message.queue || [];

        render();

    }


    else if (
        message.type ===
        "RESET"
    ) {

        currentDare = null;

        dareQueue = [];

        render();

    }

}


/* ==========================================
   RENDER
========================================== */

function render() {

    renderCurrentDare();

    renderQueue();

}


/* ==========================================
   CURRENT DARE
========================================== */

function renderCurrentDare() {

    if (!currentDare) {

        emptyState.style.display =
            "block";

        currentDareElement.style.display =
            "none";

        return;

    }


    emptyState.style.display =
        "none";

    currentDareElement.style.display =
        "block";


    viewerElement.textContent =
        "@" +
        (
            currentDare.viewer ||
            "Anonymous"
        );


    dareTextElement.textContent =
        currentDare.text || "";


    rewardElement.textContent =
        currentDare.reward || 0;


    durationElement.textContent =
        currentDare.duration || 30;


    const dareStatus =
        currentDare.status ||
        "pending";


    statusElement.textContent =
        dareStatus.toUpperCase();


    updateStatusColor();


    /* ==================================
       IMPORTANT BUTTON LOGIC
    ================================== */

    if (
        dareStatus ===
        "pending"
    ) {

        decisionButtons.style.display =
            "grid";

        finishButtons.style.display =
            "none";

    }


    else if (
        dareStatus ===
        "accepted"
    ) {

        decisionButtons.style.display =
            "none";

        finishButtons.style.display =
            "grid";

    }


    else {

        decisionButtons.style.display =
            "none";

        finishButtons.style.display =
            "none";

    }

}


/* ==========================================
   STATUS COLOR
========================================== */

function updateStatusColor() {

    const dareStatus =
        currentDare.status;


    if (
        dareStatus ===
        "accepted"
    ) {

        statusElement.style.background =
            "#16a34a";

    }

    else if (
        dareStatus ===
        "rejected"
    ) {

        statusElement.style.background =
            "#dc2626";

    }

    else if (
        dareStatus ===
        "completed"
    ) {

        statusElement.style.background =
            "#2563eb";

    }

    else if (
        dareStatus ===
        "failed"
    ) {

        statusElement.style.background =
            "#9333ea";

    }

    else {

        statusElement.style.background =
            "#e53935";

    }

}


/* ==========================================
   QUEUE
========================================== */

function renderQueue() {

    queueCount.textContent =
        dareQueue.length;


    if (
        dareQueue.length ===
        0
    ) {

        queueList.innerHTML =
            '<div class="empty">' +
            'No dares waiting' +
            '</div>';

        return;

    }


    queueList.innerHTML =
        "";


    dareQueue.forEach(
        function(dare, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "queue-item";


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "queue-number";

            number.textContent =
                "#" +
                (index + 1);


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "queue-content";


            const viewer =
                document.createElement(
                    "div"
                );

            viewer.className =
                "queue-viewer";

            viewer.textContent =
                "@" +
                (
                    dare.viewer ||
                    "Anonymous"
                );


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "queue-text";

            text.textContent =
                dare.text || "";


            content.appendChild(
                viewer
            );

            content.appendChild(
                text
            );


            const reward =
                document.createElement(
                    "div"
                );

            reward.className =
                "queue-reward";

            reward.textContent =
                "₱" +
                (
                    dare.reward ||
                    0
                );


            item.appendChild(
                number
            );

            item.appendChild(
                content
            );

            item.appendChild(
                reward
            );


            queueList.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   CHANGE STATUS
========================================== */

async function setDareStatus(
    newStatus
) {

    if (!currentDare) {

        return;

    }


    try {

        const response =
            await fetch(

                BACKEND_URL +
                "/api/dare/" +
                encodeURIComponent(
                    currentDare.id
                ) +
                "/status",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Request failed"
            );

        }


        /*
        Immediately update
        the controller.
        */

        currentDare =
            data.dare;

        dareQueue =
            data.queue || [];


        render();


        showToast(

            newStatus
                .toUpperCase()

        );

    }


    catch(error) {

        console.error(
            error
        );

        showToast(
            "❌ " +
            error.message
        );

    }

}


/* ==========================================
   REFRESH
========================================== */

async function refreshState() {

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/dare"
            );


        const data =
            await response.json();


        currentDare =
            data.currentDare;

        dareQueue =
            data.queue || [];


        render();

    }


    catch(error) {

        console.error(
            error
        );

        showToast(
            "❌ Backend unavailable"
        );

    }

}


/* ==========================================
   CLEAR
========================================== */

async function clearQueue() {

    const confirmed =
        confirm(
            "Clear all dares?"
        );


    if (!confirmed) {

        return;

    }


    try {

        await fetch(

            BACKEND_URL +
            "/api/dare/clear",

            {
                method:
                    "POST"
            }

        );


        showToast(
            "🗑️ Cleared"
        );

    }


    catch(error) {

        console.error(
            error
        );

        showToast(
            "❌ Could not clear"
        );

    }

}


/* ==========================================
   TOAST
========================================== */

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* ==========================================
   START
========================================== */

render();

connectWebSocket();

refreshState();

</script>

</body>
</html>
