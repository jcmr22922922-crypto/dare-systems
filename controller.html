<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dare System Controller</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #08080d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}


/* ==========================================
   HEADER
========================================== */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #aaa;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4444;
}

.dot.connected {
    background: #22c55e;
}


/* ==========================================
   STREAMER SELECTOR
========================================== */

.streamer-selector {
    background: #111118;
    border: 1px solid #252530;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
}

.selector-label {
    color: #777;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.streamer-row {
    display: flex;
    gap: 10px;
}

.streamer-select {
    flex: 1;
    width: 100%;
    background: #1b1b24;
    color: white;
    border: 1px solid #30303a;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    outline: none;
}

.streamer-select:focus {
    border-color: #8b5cf6;
}

.streamer-status {
    margin-top: 10px;
    color: #777;
    font-size: 12px;
}


/* ==========================================
   CARDS
========================================== */

.card {
    background: #111118;
    border: 1px solid #252530;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
}

.card-title {
    color: #777;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 18px;
}


/* ==========================================
   EMPTY
========================================== */

.empty {
    text-align: center;
    color: #666;
    padding: 40px 15px;
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}


/* ==========================================
   CURRENT DARE
========================================== */

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 7px;
    background: #e53935;
    font-size: 10px;
    font-weight: 900;
    margin-bottom: 12px;
}

.viewer {
    color: #888;
    font-size: 14px;
    margin-bottom: 12px;
}

.viewer strong {
    color: white;
}

.dare-text {
    font-size: clamp(25px, 5vw, 40px);
    line-height: 1.15;
    font-weight: 900;
    margin-bottom: 18px;
    word-break: break-word;
}

.details {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.detail {
    background: #1b1b24;
    border-radius: 9px;
    padding: 9px 12px;
    color: #aaa;
    font-size: 12px;
    font-weight: 700;
}

.detail span {
    color: white;
}


/* ==========================================
   BUTTONS
========================================== */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    border-radius: 11px;
    padding: 15px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.accept {
    background: #22c55e;
    color: #031008;
}

.reject {
    background: #ef4444;
    color: white;
}

.complete {
    background: #3b82f6;
    color: white;
}

.failed {
    background: #9333ea;
    color: white;
}


/* ==========================================
   QUEUE
========================================== */

.queue-count {
    color: white;
    margin-left: 5px;
}

.queue-item {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 14px;

    border-bottom: 1px solid #24242c;

    border-radius: 10px;

    cursor: pointer;

    transition:
        background .15s,
        transform .15s;
}

.queue-item:hover {
    background: #1a1a24;
    transform: translateX(2px);
}

.queue-item:last-child {
    border-bottom: none;
}

.queue-number {
    min-width: 30px;
    color: #777;
    font-weight: 900;
}

.queue-content {
    flex: 1;
    min-width: 0;
}

.queue-viewer {
    color: #888;
    font-size: 11px;
    margin-bottom: 4px;
}

.queue-text {
    font-size: 14px;
    font-weight: 700;
    word-break: break-word;
}

.queue-reward {
    color: #aaa;
    font-size: 12px;
    white-space: nowrap;
}


/* ==========================================
   QUEUE HINT
========================================== */

.queue-hint {
    color: #555;
    font-size: 11px;
    text-align: center;
    margin-top: 12px;
}


/* ==========================================
   SECONDARY
========================================== */

.secondary {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.secondary button {
    background: #1b1b24;
    color: #aaa;
    font-size: 11px;
    padding: 10px 13px;
}


/* ==========================================
   TOAST
========================================== */

#toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%, 20px);

    opacity: 0;

    background: #181820;

    border:
        1px solid
        #30303a;

    border-radius: 10px;

    padding: 12px 16px;

    font-size: 13px;

    transition: .2s;

    pointer-events: none;

    z-index: 9999;
}

#toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .connection {
        align-self: flex-start;
    }

    .card {
        padding: 18px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .secondary {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     HEADER
====================================== -->

<header>

    <div class="logo">
        🎯 DARE SYSTEM
    </div>

    <div class="connection">

        <div
            id="connectionDot"
            class="dot">
        </div>

        <span id="connectionText">
            Connecting...
        </span>

    </div>

</header>


<!-- ======================================
     STREAMER SELECTOR
====================================== -->

<div class="streamer-selector">

    <div class="selector-label">
        CONTROLLING STREAMER
    </div>

    <div class="streamer-row">

        <select
            id="streamerSelect"
            class="streamer-select">

            <option value="">
                Loading streamers...
            </option>

        </select>

    </div>

    <div
        id="streamerStatus"
        class="streamer-status">

        Loading connected streamers...

    </div>

</div>


<!-- ======================================
     CURRENT DARE
====================================== -->

<div class="card">

    <div class="card-title">
        CURRENT DARE
    </div>


    <div
        id="emptyState"
        class="empty">

        <div class="empty-icon">
            🎯
        </div>

        No active dare

    </div>


    <div
        id="currentDare"
        style="display:none;">


        <div
            id="status"
            class="status">

            PENDING

        </div>


        <div class="viewer">

            From:

            <strong id="viewer">
                @viewer
            </strong>

        </div>


        <div
            id="dareText"
            class="dare-text">
        </div>


        <div class="details">

            <div class="detail">

                💰 ₱<span id="reward">
                    0.00
                </span>

            </div>


            <div class="detail">

                ⏱️ <span id="duration">
                    30
                </span>s

            </div>


            <div class="detail">

                🎥 <span id="targetStreamer">
                    -
                </span>

            </div>

        </div>


        <!-- ==================================
             ACCEPT / REJECT
        ================================== -->

        <div
            id="decisionButtons"
            class="buttons">

            <button
                id="acceptButton"
                class="accept"
                onclick="setDareStatus('accepted')">

                ✅ ACCEPT

            </button>


            <button
                id="rejectButton"
                class="reject"
                onclick="setDareStatus('rejected')">

                ❌ REJECT

            </button>

        </div>


        <!-- ==================================
             COMPLETE / FAILED
        ================================== -->

        <div
            id="finishButtons"
            class="buttons"
            style="display:none; margin-top:10px;">

            <button
                class="complete"
                onclick="setDareStatus('completed')">

                🏁 COMPLETED

            </button>


            <button
                class="failed"
                onclick="setDareStatus('failed')">

                🚫 FAILED

            </button>

        </div>


    </div>

</div>


<!-- ======================================
     WAITING QUEUE
====================================== -->

<div class="card">

    <div class="card-title">

        WAITING QUEUE

        <span
            id="queueCount"
            class="queue-count">

            0

        </span>

    </div>


    <div id="queueList">

        <div class="empty">

            No dares waiting

        </div>

    </div>


    <div class="queue-hint">

        💡 Click a dare to control it

    </div>


    <div class="secondary">

        <button onclick="refreshState()">

            🔄 Refresh

        </button>


        <button onclick="clearQueue()">

            🗑️ Clear All

        </button>

    </div>

</div>


</div>


<div id="toast"></div>


<script>

/* ==========================================
   BACKEND
========================================== */

const BACKEND_URL =
    "https://dare-backend-vx8w.onrender.com";


const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* ==========================================
   STATE
========================================== */

let currentDare = null;

let dareQueue = [];

let activeDares = [];

let streamers = [];

let selectedStreamer = "";

let socket = null;

let toastTimer = null;


/*
 * Stores all queues by streamer.
 */

window.latestQueues = {};


/* ==========================================
   ELEMENTS
========================================== */

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const streamerSelect =
    document.getElementById(
        "streamerSelect"
    );

const streamerStatus =
    document.getElementById(
        "streamerStatus"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const viewerElement =
    document.getElementById(
        "viewer"
    );

const dareTextElement =
    document.getElementById(
        "dareText"
    );

const rewardElement =
    document.getElementById(
        "reward"
    );

const durationElement =
    document.getElementById(
        "duration"
    );

const targetStreamerElement =
    document.getElementById(
        "targetStreamer"
    );

const decisionButtons =
    document.getElementById(
        "decisionButtons"
    );

const finishButtons =
    document.getElementById(
        "finishButtons"
    );

const acceptButton =
    document.getElementById(
        "acceptButton"
    );

const rejectButton =
    document.getElementById(
        "rejectButton"
    );

const queueList =
    document.getElementById(
        "queueList"
    );

const queueCount =
    document.getElementById(
        "queueCount"
    );


/* ==========================================
   LOAD STREAMERS
========================================== */

async function loadStreamers() {

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/streamers"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load streamers."
            );

        }


        const data =
            await response.json();


        streamers =
            data.streamers || [];


        populateStreamerSelector();


    }

    catch(error) {

        console.error(
            "Streamer loading error:",
            error
        );


        streamerSelect.innerHTML =
            `
            <option value="">
                No streamers available
            </option>
            `;


        streamerStatus.textContent =
            "Could not load connected streamers.";

    }

}


/* ==========================================
   POPULATE STREAMER SELECTOR
========================================== */

function populateStreamerSelector() {

    const previousSelection =
        selectedStreamer;


    streamerSelect.innerHTML = "";


    if (
        streamers.length === 0
    ) {

        streamerSelect.innerHTML =
            `
            <option value="">
                No connected streamers
            </option>
            `;


        streamerStatus.textContent =
            "No streamers are currently connected.";


        selectedStreamer = "";

        currentDare = null;

        dareQueue = [];

        render();

        return;

    }


    streamers.forEach(
        streamer => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                streamer.username;


            option.textContent =
                streamer.displayName ||
                streamer.username;


            streamerSelect.appendChild(
                option
            );

        }
    );


    const stillExists =
        streamers.some(
            streamer =>
                streamer.username.toLowerCase() ===
                previousSelection.toLowerCase()
        );


    if (stillExists) {

        selectedStreamer =
            previousSelection;

    }

    else {

        selectedStreamer =
            streamers[0].username;

    }


    streamerSelect.value =
        selectedStreamer;


    updateStreamerStatus();


    syncSelectedStreamer();

}


/* ==========================================
   STREAMER CHANGED
========================================== */

streamerSelect.addEventListener(
    "change",
    function() {

        selectedStreamer =
            streamerSelect.value;


        /*
         * When switching streamer, clear the
         * currently selected pending dare.
         */

        currentDare = null;


        syncSelectedStreamer();

    }
);


/* ==========================================
   SYNC SELECTED STREAMER
========================================== */

function syncSelectedStreamer() {

    if (!selectedStreamer) {

        currentDare = null;

        dareQueue = [];

        render();

        return;

    }


    const key =
        selectedStreamer.toLowerCase();


    /*
     * Find active dare for this streamer.
     */

    const active =
        activeDares.find(
            dare =>
                dare &&
                dare.streamer &&
                dare.streamer.toLowerCase() ===
                key
        );


    /*
     * If an active dare exists, it always
     * takes priority.
     */

    if (active) {

        currentDare =
            active;

    }

    /*
     * If currentDare is already a pending dare
     * belonging to this streamer, keep it selected.
     */

    else if (
        currentDare &&
        currentDare.streamer &&
        currentDare.streamer.toLowerCase() ===
        key &&
        currentDare.status === "pending"
    ) {

        /*
         * Keep selected pending dare.
         */

    }

    else {

        currentDare = null;

    }


    /*
     * Load this streamer's queue.
     */

    if (
        window.latestQueues &&
        window.latestQueues[key]
    ) {

        dareQueue =
            window.latestQueues[key];

    }

    else {

        dareQueue = [];

    }


    updateStreamerStatus();

    render();

}


/* ==========================================
   STREAMER STATUS
========================================== */

function updateStreamerStatus() {

    if (!selectedStreamer) {

        streamerStatus.textContent =
            "No streamer selected.";

        return;

    }


    const streamer =
        streamers.find(
            item =>
                item.username.toLowerCase() ===
                selectedStreamer.toLowerCase()
        );


    if (!streamer) {

        streamerStatus.textContent =
            "Streamer unavailable.";

        return;

    }


    streamerStatus.textContent =
        "🟢 Connected as " +
        streamer.displayName;

}


/* ==========================================
   WEBSOCKET
========================================== */

function connectWebSocket() {

    connectionText.textContent =
        "Connecting...";


    connectionDot.classList.remove(
        "connected"
    );


    socket =
        new WebSocket(
            WS_URL
        );


    socket.onopen =
        function() {

            console.log(
                "Connected to Dare Server"
            );


            connectionText.textContent =
                "Connected";


            connectionDot.classList.add(
                "connected"
            );


            socket.send(
                JSON.stringify({
                    type: "GET_STATE"
                })
            );

        };


    socket.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                console.log(
                    "SERVER MESSAGE:",
                    message
                );


                handleMessage(
                    message
                );

            }

            catch(error) {

                console.error(
                    "Message error:",
                    error
                );

            }

        };


    socket.onclose =
        function() {

            connectionText.textContent =
                "Disconnected";


            connectionDot.classList.remove(
                "connected"
            );


            setTimeout(
                connectWebSocket,
                2000
            );

        };


    socket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

        };

}


/* ==========================================
   HANDLE SERVER MESSAGES
========================================== */

function handleMessage(message) {

    console.log(
        "Server:",
        message
    );


    /* ======================================
       STATE
    ====================================== */

    if (
        message.type === "STATE"
    ) {

        activeDares =
            message.activeDares || [];


        window.latestQueues =
            message.queues || {};


        if (
            message.streamers &&
            message.streamers.length
        ) {

            streamers =
                message.streamers;

        }


        populateStreamerSelector();

        return;

    }


    /* ======================================
       DARE CREATED
    ====================================== */

    if (
        message.type === "DARE_CREATED"
    ) {

        const dare =
            message.dare;


        if (
            dare &&
            dare.streamer
        ) {

            const key =
                dare.streamer.toLowerCase();


            window.latestQueues[key] =
                message.queue || [];


            if (
                selectedStreamer.toLowerCase() ===
                key
            ) {

                dareQueue =
                    message.queue || [];


                renderQueue();

            }

        }

        return;

    }


    /* ======================================
       QUEUE UPDATED
    ====================================== */

    if (
        message.type === "QUEUE_UPDATED"
    ) {

        if (
            message.streamer
        ) {

            const key =
                message.streamer.toLowerCase();


            window.latestQueues[key] =
                message.queue || [];


            if (
                selectedStreamer.toLowerCase() ===
                key
            ) {

                dareQueue =
                    message.queue || [];


                /*
                 * If the selected pending dare was
                 * removed from the queue, clear it.
                 */

                if (
                    currentDare &&
                    currentDare.status === "pending"
                ) {

                    const stillInQueue =
                        dareQueue.some(
                            dare =>
                                Number(dare.id) ===
                                Number(currentDare.id)
                        );


                    if (!stillInQueue) {

                        currentDare = null;

                    }

                }


                render();

            }

        }

        return;

    }


    /* ======================================
       ACTIVE DARE
    ====================================== */

    if (
        message.type === "ACTIVE_DARE"
    ) {

        const dare =
            message.dare;


        if (
            dare &&
            dare.streamer
        ) {

            const key =
                dare.streamer.toLowerCase();


            const index =
                activeDares.findIndex(
                    item =>
                        item &&
                        item.streamer &&
                        item.streamer.toLowerCase() ===
                        key
                );


            if (index !== -1) {

                activeDares[index] =
                    dare;

            }

            else {

                activeDares.push(
                    dare
                );

            }


            if (
                message.queue
            ) {

                window.latestQueues[key] =
                    message.queue;

            }


            /*
             * Automatically select the streamer.
             */

            selectedStreamer =
                dare.streamer;


            streamerSelect.value =
                selectedStreamer;


            currentDare =
                dare;


            dareQueue =
                window.latestQueues[key] ||
                [];


            render();


            showToast(
                "🎯 Dare accepted!"
            );

        }

        return;

    }


    /* ======================================
       DARE REJECTED
    ====================================== */

    if (
        message.type === "DARE_REJECTED"
    ) {

        const dare =
            message.dare;


        if (
            dare &&
            dare.streamer
        ) {

            const key =
                dare.streamer.toLowerCase();


            window.latestQueues[key] =
                message.queue || [];


            if (
                selectedStreamer.toLowerCase() ===
                key
            ) {

                dareQueue =
                    message.queue || [];


                if (
                    currentDare &&
                    Number(currentDare.id) ===
                    Number(dare.id)
                ) {

                    currentDare = null;

                }


                render();

            }

        }

        return;

    }


    /* ======================================
       ACTIVE CLEARED
    ====================================== */

    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        const streamer =
            message.streamer;


        if (streamer) {

            const key =
                streamer.toLowerCase();


            activeDares =
                activeDares.filter(
                    dare =>
                        !dare.streamer ||
                        dare.streamer.toLowerCase() !==
                        key
                );


            if (
                selectedStreamer.toLowerCase() ===
                key
            ) {

                currentDare = null;

                render();

            }

        }

        return;

    }


    /* ======================================
       COMPLETED
    ====================================== */

    if (
        message.type ===
        "DARE_COMPLETED"
    ) {

        const dare =
            message.dare;


        if (
            dare
        ) {

            activeDares =
                activeDares.filter(
                    item =>
                        Number(item.id) !==
                        Number(dare.id)
                );


            if (
                currentDare &&
                Number(currentDare.id) ===
                Number(dare.id)
            ) {

                currentDare = null;

            }


            render();

        }

        return;

    }


    /* ======================================
       FAILED
    ====================================== */

    if (
        message.type ===
        "DARE_FAILED"
    ) {

        const dare =
            message.dare;


        if (
            dare
        ) {

            activeDares =
                activeDares.filter(
                    item =>
                        Number(item.id) !==
                        Number(dare.id)
                );


            if (
                currentDare &&
                Number(currentDare.id) ===
                Number(dare.id)
            ) {

                currentDare = null;

            }


            render();

        }

        return;

    }


    /* ======================================
       RESET
    ====================================== */

    if (
        message.type === "RESET"
    ) {

        activeDares = [];

        window.latestQueues = {};

        currentDare = null;

        dareQueue = [];

        render();


        showToast(
            "🗑️ All dares cleared"
        );


        return;

    }

}


/* ==========================================
   RENDER
========================================== */

function render() {

    renderCurrentDare();

    renderQueue();

}


/* ==========================================
   CURRENT DARE
========================================== */

function renderCurrentDare() {

    if (!currentDare) {

        emptyState.style.display =
            "block";


        currentDareElement.style.display =
            "none";


        return;

    }


    emptyState.style.display =
        "none";


    currentDareElement.style.display =
        "block";


    viewerElement.textContent =
        "@" +
        (
            currentDare.viewer ||
            "Anonymous"
        );


    dareTextElement.textContent =
        currentDare.text ||
        currentDare.dareText ||
        currentDare.dare_text ||
        "";


    rewardElement.textContent =
        Number(
            currentDare.reward || 0
        ).toFixed(2);


    durationElement.textContent =
        currentDare.duration ||
        30;


    targetStreamerElement.textContent =
        "@" +
        (
            currentDare.streamer ||
            selectedStreamer
        );


    const dareStatus =
        currentDare.status ||
        "pending";


    statusElement.textContent =
        dareStatus.toUpperCase();


    updateStatusColor();


    /* ======================================
       BUTTON LOGIC
    ====================================== */

    if (
        dareStatus === "pending"
    ) {

        decisionButtons.style.display =
            "grid";


        finishButtons.style.display =
            "none";


        acceptButton.disabled =
            false;


        rejectButton.disabled =
            false;

    }


    else if (
        dareStatus === "accepted"
    ) {

        decisionButtons.style.display =
            "none";


        finishButtons.style.display =
            "grid";

    }


    else {

        decisionButtons.style.display =
            "none";


        finishButtons.style.display =
            "none";

    }

}


/* ==========================================
   STATUS COLOR
========================================== */

function updateStatusColor() {

    const dareStatus =
        currentDare.status ||
        "pending";


    if (
        dareStatus === "accepted"
    ) {

        statusElement.style.background =
            "#16a34a";

    }

    else if (
        dareStatus === "rejected"
    ) {

        statusElement.style.background =
            "#dc2626";

    }

    else if (
        dareStatus === "completed"
    ) {

        statusElement.style.background =
            "#2563eb";

    }

    else if (
        dareStatus === "failed"
    ) {

        statusElement.style.background =
            "#9333ea";

    }

    else {

        statusElement.style.background =
            "#e53935";

    }

}


/* ==========================================
   RENDER QUEUE
========================================== */

function renderQueue() {

    queueCount.textContent =
        dareQueue.length;


    if (
        dareQueue.length === 0
    ) {

        queueList.innerHTML =
            `
            <div class="empty">
                No dares waiting
            </div>
            `;

        return;

    }


    queueList.innerHTML =
        "";


    dareQueue.forEach(
        function(dare, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "queue-item";


            /*
             * Number
             */

            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "queue-number";


            number.textContent =
                "#" +
                (index + 1);


            /*
             * Content
             */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "queue-content";


            const viewer =
                document.createElement(
                    "div"
                );


            viewer.className =
                "queue-viewer";


            viewer.textContent =
                "@" +
                (
                    dare.viewer ||
                    "Anonymous"
                );


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "queue-text";


            text.textContent =
                dare.text ||
                dare.dareText ||
                dare.dare_text ||
                "";


            content.appendChild(
                viewer
            );


            content.appendChild(
                text
            );


            /*
             * Reward
             */

            const reward =
                document.createElement(
                    "div"
                );


            reward.className =
                "queue-reward";


            reward.textContent =
                "₱" +
                Number(
                    dare.reward || 0
                ).toFixed(2);


            /*
             * Click queue item
             */

            item.addEventListener(
                "click",
                function() {

                    /*
                     * Don't allow selecting another
                     * dare while one is active.
                     */

                    const activeForStreamer =
                        activeDares.find(
                            active =>
                                active &&
                                active.streamer &&
                                active.streamer.toLowerCase() ===
                                selectedStreamer.toLowerCase()
                        );


                    if (
                        activeForStreamer
                    ) {

                        showToast(
                            "⚠️ Finish the current dare first"
                        );

                        return;

                    }


                    /*
                     * Select the pending dare.
                     */

                    currentDare =
                        dare;


                    /*
                     * Make sure the streamer matches.
                     */

                    selectedStreamer =
                        dare.streamer ||
                        selectedStreamer;


                    streamerSelect.value =
                        selectedStreamer;


                    renderCurrentDare();


                    /*
                     * Scroll to current dare.
                     */

                    currentDareElement.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });


                    showToast(
                        "🎯 Dare selected"
                    );

                }
            );


            item.appendChild(
                number
            );


            item.appendChild(
                content
            );


            item.appendChild(
                reward
            );


            queueList.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   SET DARE STATUS
========================================== */

async function setDareStatus(
    newStatus
) {

    if (!currentDare) {

        showToast(
            "❌ No dare selected"
        );

        return;

    }


    /*
     * Make sure the dare belongs to the
     * selected streamer.
     */

    if (
        currentDare.streamer &&
        selectedStreamer &&
        currentDare.streamer.toLowerCase() !==
        selectedStreamer.toLowerCase()
    ) {

        showToast(
            "❌ Wrong streamer selected"
        );

        return;

    }


    /*
     * Prevent duplicate clicks.
     */

    acceptButton.disabled =
        true;

    rejectButton.disabled =
        true;


    try {

        const response =
            await fetch(

                BACKEND_URL +
                "/api/dare/" +
                encodeURIComponent(
                    currentDare.id
                ) +
                "/status",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Request failed"
            );

        }


        console.log(
            "STATUS RESPONSE:",
            data
        );


        /*
         * ACCEPTED
         */

        if (
            newStatus === "accepted"
        ) {

            const acceptedDare =
                data.dare;


            if (!acceptedDare) {

                throw new Error(
                    "Server did not return the accepted dare."
                );

            }


            const index =
                activeDares.findIndex(
                    dare =>
                        Number(dare.id) ===
                        Number(acceptedDare.id)
                );


            if (
                index !== -1
            ) {

                activeDares[index] =
                    acceptedDare;

            }

            else {

                activeDares.push(
                    acceptedDare
                );

            }


            currentDare =
                acceptedDare;


            dareQueue =
                data.queue || [];


            window.latestQueues[
                selectedStreamer.toLowerCase()
            ] =
                dareQueue;


            render();


            showToast(
                "✅ Dare accepted!"
            );

        }


        /*
         * REJECTED / COMPLETED / FAILED
         */

        else {

            const finishedId =
                currentDare.id;


            activeDares =
                activeDares.filter(
                    dare =>
                        Number(dare.id) !==
                        Number(finishedId)
                );


            currentDare =
                null;


            dareQueue =
                data.queue || [];


            window.latestQueues[
                selectedStreamer.toLowerCase()
            ] =
                dareQueue;


            render();


            if (
                newStatus === "rejected"
            ) {

                showToast(
                    "❌ Dare rejected"
                );

            }

            else if (
                newStatus === "completed"
            ) {

                showToast(
                    "🏁 Dare completed"
                );

            }

            else if (
                newStatus === "failed"
            ) {

                showToast(
                    "🚫 Dare failed"
                );

            }

        }

    }

    catch(error) {

        console.error(
            "Status error:",
            error
        );


        showToast(
            "❌ " +
            error.message
        );


        acceptButton.disabled =
            false;


        rejectButton.disabled =
            false;

    }

}


/* ==========================================
   REFRESH
========================================== */

async function refreshState() {

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/dare"
            );


        if (!response.ok) {

            throw new Error(
                "Backend unavailable"
            );

        }


        const data =
            await response.json();


        activeDares =
            data.activeDares || [];


        window.latestQueues =
            data.queues || {};


        if (
            data.streamers
        ) {

            streamers =
                data.streamers;

        }


        populateStreamerSelector();


        showToast(
            "🔄 Refreshed"
        );

    }

    catch(error) {

        console.error(
            "Refresh error:",
            error
        );


        showToast(
            "❌ Backend unavailable"
        );

    }

}


/* ==========================================
   CLEAR ALL
========================================== */

async function clearQueue() {

    const confirmed =
        confirm(
            "Clear ALL dares for ALL streamers?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                BACKEND_URL +
                "/api/dare/clear",

                {

                    method:
                        "POST"

                }

            );


        const data =
            await response.json()
            .catch(
                () => ({})
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not clear dares."
            );

        }


        activeDares = [];

        window.latestQueues = {};

        currentDare = null;

        dareQueue = [];


        render();


        showToast(
            "🗑️ All dares cleared"
        );

    }

    catch(error) {

        console.error(
            "Clear error:",
            error
        );


        showToast(
            "❌ Could not clear"
        );

    }

}


/* ==========================================
   TOAST
========================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* ==========================================
   START
========================================== */

render();

loadStreamers();

connectWebSocket();

refreshState();

</script>
