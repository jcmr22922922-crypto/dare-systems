<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARE Controller</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08090c;
    --panel: #111318;
    --panel-2: #16181e;
    --border: #272a33;
    --text: #ffffff;
    --muted: #969ba8;
    --red: #ff2b2b;
    --green: #20c76a;
    --yellow: #f5c542;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at top right,
            rgba(255, 43, 43, 0.08),
            transparent 35%
        ),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    padding: 24px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background:
        linear-gradient(
            135deg,
            var(--red),
            #8e1010
        );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 900;
    box-shadow:
        0 0 25px
        rgba(255, 43, 43, 0.2);
}

.brand h1 {
    margin: 0;
    font-size: 25px;
}

.brand p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* =========================
   HEADER ACTIONS
========================= */

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px 15px;
    border-radius: 10px;
    background: #16181e;
    border: 1px solid var(--border);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    transition: 0.15s ease;
}

.home-btn:hover {
    background: #22252d;
    border-color: #3a3e48;
    transform: translateY(-1px);
}

/* =========================
   CONNECTION STATUS
========================= */

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
}

.connected {
    background:
        rgba(32, 199, 106, 0.12);
    color: #55e994;
    border:
        1px solid
        rgba(32, 199, 106, 0.25);
}

.disconnected {
    background:
        rgba(255, 43, 43, 0.12);
    color: #ff7070;
    border:
        1px solid
        rgba(255, 43, 43, 0.25);
}

.authenticating {
    background:
        rgba(245, 197, 66, 0.12);
    color: #f5d56d;
    border:
        1px solid
        rgba(245, 197, 66, 0.25);
}

/* =========================
   CARDS
========================= */

.card {
    background:
        rgba(17, 19, 24, 0.96);
    border:
        1px solid
        var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.18);
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.card-title h2 {
    margin: 0;
    font-size: 17px;
}

/* =========================
   STREAMER
========================= */

.streamer-profile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px;
    background: #0c0e12;
    border:
        1px solid
        var(--border);
    border-radius: 12px;
}

.streamer-main {
    min-width: 0;
}

.streamer-name {
    font-size: 21px;
    font-weight: 900;
    word-break: break-word;
}

.streamer-platform {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
}

.streamer-id {
    color: #707582;
    font-size: 11px;
    margin-top: 5px;
}

.online-badge {
    flex-shrink: 0;
    padding: 7px 11px;
    border-radius: 999px;
    background:
        rgba(32, 199, 106, 0.12);
    border:
        1px solid
        rgba(32, 199, 106, 0.25);
    color: #55e994;
    font-size: 11px;
    font-weight: 900;
}

/* =========================
   ACTIVE DARE
========================= */

.active-dare {
    border-color:
        rgba(255, 43, 43, 0.45);
    background:
        radial-gradient(
            circle at top right,
            rgba(255, 43, 43, 0.08),
            transparent 45%
        ),
        var(--panel);
}

.live-label,
.pending-label {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 900;
}

.live-label {
    background:
        rgba(255, 43, 43, 0.13);
    color: #ff6262;
}

.pending-label {
    background:
        rgba(245, 197, 66, 0.12);
    color: var(--yellow);
}

.dare-text {
    font-size: 27px;
    font-weight: 900;
    line-height: 1.3;
    margin: 18px 0;
    word-break: break-word;
}

.meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
}

.meta strong {
    color: #fff;
}

.timer {
    font-size: 50px;
    font-weight: 900;
    text-align: center;
    margin: 24px 0;
}

.buttons {
    display: flex;
    gap: 10px;
}

.buttons button {
    flex: 1;
}

/* =========================
   BUTTONS
========================= */

button {
    border: none;
    border-radius: 10px;
    padding: 12px 17px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.15s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.accept,
.complete {
    background: #178d4c;
    color: white;
}

.reject,
.fail {
    background: #a91f25;
    color: white;
}

/* =========================
   QUEUE
========================= */

.queue-item {
    background: #0c0e12;
    border:
        1px solid
        var(--border);
    border-radius: 12px;
    padding: 17px;
    margin-bottom: 10px;
}

.queue-number {
    color: #ff5555;
    font-weight: 900;
    margin-right: 7px;
}

.queue-dare {
    margin-top: 11px;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 700;
}

.queue-buttons {
    display: flex;
    gap: 10px;
    margin-top: 13px;
}

.queue-buttons button {
    flex: 1;
}

.empty {
    color: #707582;
    text-align: center;
    padding: 25px 15px;
    border:
        1px dashed
        #2b2e36;
    border-radius: 10px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform:
        translateX(-50%)
        translateY(15px);
    background: #17191f;
    border:
        1px solid
        #363944;
    padding: 12px 17px;
    border-radius: 10px;
    display: none;
    z-index: 9999;
    font-size: 14px;
}

.toast.show {
    display: block;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        padding: 14px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .header-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
    }

    .streamer-profile {
        align-items: flex-start;
        flex-direction: column;
    }

    .dare-text {
        font-size: 22px;
    }

    .timer {
        font-size: 40px;
    }

    .buttons,
    .queue-buttons {
        flex-direction: column;
    }

    .home-btn {
        flex: 1;
    }

    .status {
        flex: 1;
        justify-content: center;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- =====================
         HEADER
    ====================== -->

    <div class="header">

        <div class="brand">

            <div class="brand-logo">
                D
            </div>

            <div>
                <h1>DARE Controller</h1>

                <p>
                    Manage your live dare queue
                </p>
            </div>

        </div>

        <div class="header-actions">

            <a
                href="index.html"
                class="home-btn"
            >
                🏠 Home
            </a>

            <div
                id="connectionStatus"
                class="status disconnected"
            >
                🔴 Connecting...
            </div>

        </div>

    </div>


    <!-- =====================
         STREAMER PROFILE
    ====================== -->

    <div class="card">

        <div class="card-title">

            <h2>
                🎥 YOUR STREAMER PROFILE
            </h2>

        </div>

        <div
            id="streamerProfile"
            class="streamer-profile"
        >

            <div class="empty">
                Loading streamer profile...
            </div>

        </div>

    </div>


    <!-- =====================
         ACTIVE DARE
    ====================== -->

    <div class="card active-dare">

        <div class="card-title">

            <h2>
                🔥 ACTIVE DARE
            </h2>

        </div>

        <div id="currentDare">

            <div class="empty">
                No active dare
            </div>

        </div>

    </div>


    <!-- =====================
         WAITING QUEUE
    ====================== -->

    <div class="card">

        <div class="card-title">

            <h2>
                ⏳ WAITING QUEUE
            </h2>

        </div>

        <div id="queue">

            <div class="empty">
                No waiting dares
            </div>

        </div>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    id="toast"
    class="toast"
></div>


<!-- =========================
     AUTH
========================= -->

<script src="auth.js?v=1003"></script>

<script>

/* ============================================================
   CONFIG
============================================================ */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* ============================================================
   STATE
============================================================ */

let ws = null;
let myStreamer = null;
let selectedStreamerId = null;
let activeDares = {};
let queues = {};
let currentDare = null;
let timerInterval = null;
let reconnectTimer = null;
let toastTimer = null;
let authenticatedSocket = false;
let reconnectAttempt = 0;


/* ============================================================
   ELEMENTS
============================================================ */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const streamerProfileElement =
    document.getElementById(
        "streamerProfile"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const queueElement =
    document.getElementById(
        "queue"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* ============================================================
   HELPERS
============================================================ */

function streamerKey(id) {

    if (
        id === null ||
        id === undefined ||
        id === ""
    ) {
        return "";
    }

    return String(id);
}


function getDareId(dare) {

    if (!dare) {
        return null;
    }

    const value =
        dare.id ??
        dare.dare_id ??
        dare.dareId;

    if (
        value === null ||
        value === undefined
    ) {
        return null;
    }

    return Number(value);
}


function getDareStreamerId(dare) {

    if (!dare) {
        return null;
    }

    return (
        dare.streamerId ??
        dare.streamer_id ??
        null
    );
}


function dareText(dare) {

    return (
        dare?.dareText ||
        dare?.dare_text ||
        dare?.text ||
        ""
    );
}


function createdAt(dare) {

    return (
        dare?.createdAt ||
        dare?.created_at ||
        0
    );
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2800
        );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatReward(value) {

    const amount =
        Number(value || 0);

    return Number.isFinite(amount)
        ? amount.toFixed(2)
        : "0.00";
}


function getStreamerDisplayName(streamer) {

    if (!streamer) {
        return "Unknown streamer";
    }

    return (
        streamer.displayName ||
        streamer.display_name ||
        streamer.username ||
        "Streamer"
    );
}


function getStreamerPlatform(streamer) {

    if (!streamer) {
        return "";
    }

    const platform =
        streamer.platform || "";

    const platformUsername =
        streamer.platformUsername ||
        streamer.platform_username ||
        "";

    if (
        platform &&
        platformUsername
    ) {
        return (
            platform.toUpperCase() +
            " • " +
            platformUsername
        );
    }

    if (platform) {
        return platform.toUpperCase();
    }

    return "Streaming platform not connected";
}


/* ============================================================
   RENDER STREAMER PROFILE
============================================================ */

function renderStreamerProfile() {

    if (!myStreamer) {

        streamerProfileElement.innerHTML = `
            <div class="empty">
                No streamer profile was found
                for this Nerve account.
            </div>
        `;

        return;
    }

    const id =
        myStreamer.id;

    const displayName =
        getStreamerDisplayName(
            myStreamer
        );

    const platform =
        getStreamerPlatform(
            myStreamer
        );

    streamerProfileElement.innerHTML = `

        <div class="streamer-main">

            <div class="streamer-name">
                ${escapeHtml(displayName)}
            </div>

            <div class="streamer-platform">
                ${escapeHtml(platform)}
            </div>

            <div class="streamer-id">
                Nerve Streamer ID:
                ${escapeHtml(id)}
            </div>

        </div>

        <div class="online-badge">
            ● CONTROLLER READY
        </div>

    `;
}


/* ============================================================
   FIND DARE BY ID
============================================================ */

function findDareInQueue(id) {

    const targetId =
        Number(id);

    const key =
        streamerKey(
            selectedStreamerId
        );

    const queue =
        queues[key] || [];

    return (
        queue.find(
            dare =>
                getDareId(dare) === targetId
        ) ||
        null
    );
}


/* ============================================================
   SORT QUEUE
============================================================ */

function sortQueue(queue) {

    if (!Array.isArray(queue)) {
        return;
    }

    queue.sort(
        (a, b) => {

            const aDate =
                new Date(
                    createdAt(a)
                );

            const bDate =
                new Date(
                    createdAt(b)
                );

            return aDate - bDate;
        }
    );
}


/* ============================================================
   WEBSOCKET CONNECTION
============================================================ */

function connectWebSocket() {

    if (
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const token =
        getAuthToken();

    if (!token) {

        connectionStatus.textContent =
            "🔴 Not authenticated";

        connectionStatus.className =
            "status disconnected";

        return;
    }

    connectionStatus.textContent =
        "🟡 Connecting...";

    connectionStatus.className =
        "status authenticating";

    authenticatedSocket = false;

    try {

        ws =
            new WebSocket(
                WS_URL
            );

    }

    catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        connectionStatus.textContent =
            "🔴 Connection Error";

        connectionStatus.className =
            "status disconnected";

        scheduleReconnect();

        return;
    }

    ws.onopen =
        function() {

            console.log(
                "✅ WebSocket connected"
            );

            connectionStatus.textContent =
                "🟡 Authenticating...";

            connectionStatus.className =
                "status authenticating";

            reconnectAttempt = 0;

            try {

                ws.send(
                    JSON.stringify(
                        createWebSocketAuthMessage(
                            "controller"
                        )
                    )
                );

            }

            catch (error) {

                console.error(
                    "WebSocket AUTH error:",
                    error
                );

            }
        };


    ws.onclose =
        function(event) {

            console.warn(
                "WebSocket closed:",
                event.code,
                event.reason
            );

            authenticatedSocket = false;

            connectionStatus.textContent =
                "🔴 Disconnected";

            connectionStatus.className =
                "status disconnected";

            scheduleReconnect();
        };


    ws.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

            connectionStatus.textContent =
                "🔴 Connection Error";

            connectionStatus.className =
                "status disconnected";
        };


    ws.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );

                handleWebSocketMessage(
                    message
                );

            }

            catch (error) {

                console.error(
                    "WebSocket message parse error:",
                    error,
                    event.data
                );
            }
        };
}


/* ============================================================
   RECONNECT
============================================================ */

function scheduleReconnect() {

    clearTimeout(
        reconnectTimer
    );

    reconnectAttempt++;

    const delay =
        Math.min(
            10000,
            2000 +
            (
                reconnectAttempt *
                500
            )
        );

    reconnectTimer =
        setTimeout(
            connectWebSocket,
            delay
        );
}


/* ============================================================
   WEBSOCKET MESSAGE HANDLER
============================================================ */

function handleWebSocketMessage(message) {

    console.log(
        "📨 WebSocket:",
        message
    );


    if (
        message.type ===
        "AUTH_OK"
    ) {

        authenticatedSocket = true;

        connectionStatus.textContent =
            "🟢 Connected";

        connectionStatus.className =
            "status connected";

        console.log(
            "🔐 WebSocket authenticated"
        );

        try {

            ws.send(
                JSON.stringify({
                    type:
                        "GET_STATE"
                })
            );

        }

        catch (error) {

            console.error(
                "GET_STATE error:",
                error
            );
        }

        return;
    }


    if (
        message.type ===
            "AUTH_ERROR" ||
        message.type ===
            "AUTH_FAILED"
    ) {

        authenticatedSocket = false;

        connectionStatus.textContent =
            "🔴 Authentication Failed";

        connectionStatus.className =
            "status disconnected";

        showToast(
            "🔐 Session expired. Please log in again."
        );

        setTimeout(
            () => {

                clearAuthCache();

                window.location.href =
                    "login.html";

            },
            1200
        );

        return;
    }


    if (
        message.type ===
        "STATE"
    ) {

        activeDares = {};
        queues = {};

        const incomingActive =
            message.active ??
            message.activeDares ??
            message.data?.active ??
            message.data?.activeDares ??
            {};

        if (
            Array.isArray(
                incomingActive
            )
        ) {

            incomingActive.forEach(
                dare => {

                    const streamerId =
                        getDareStreamerId(
                            dare
                        );

                    if (
                        streamerId ===
                        null
                    ) {
                        return;
                    }

                    activeDares[
                        streamerKey(
                            streamerId
                        )
                    ] = dare;
                }
            );

        }

        else if (
            incomingActive &&
            typeof incomingActive ===
                "object"
        ) {

            Object.entries(
                incomingActive
            ).forEach(
                ([key, dare]) => {

                    if (!dare) {
                        return;
                    }

                    const streamerId =
                        getDareStreamerId(
                            dare
                        ) ??
                        key;

                    activeDares[
                        streamerKey(
                            streamerId
                        )
                    ] = dare;
                }
            );
        }


        const incomingQueues =
            message.queues ??
            message.queue ??
            message.data?.queues ??
            message.data?.queue ??
            {};


        if (
            Array.isArray(
                incomingQueues
            )
        ) {

            incomingQueues.forEach(
                dare => {

                    const streamerId =
                        getDareStreamerId(
                            dare
                        );

                    if (
                        streamerId ===
                        null
                    ) {
                        return;
                    }

                    const key =
                        streamerKey(
                            streamerId
                        );

                    if (
                        !queues[key]
                    ) {
                        queues[key] = [];
                    }

                    queues[key].push(
                        dare
                    );
                }
            );

        }

        else if (
            incomingQueues &&
            typeof incomingQueues ===
                "object"
        ) {

            Object.entries(
                incomingQueues
            ).forEach(
                ([key, queue]) => {

                    if (
                        !Array.isArray(
                            queue
                        )
                    ) {
                        return;
                    }

                    queues[
                        streamerKey(
                            key
                        )
                    ] = [
                        ...queue
                    ];
                }
            );
        }


        Object.keys(
            queues
        ).forEach(
            key => {

                sortQueue(
                    queues[key]
                );
            }
        );


        syncSelectedStreamer();
        renderCurrentDare();
        renderQueue();

        return;
    }


    if (
        message.type ===
        "DARE_CREATED"
    ) {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }

        updateLocalDare(
            dare
        );

        syncSelectedStreamer();
        renderCurrentDare();
        renderQueue();

        return;
    }


    if (
        message.type ===
        "ACTIVE_DARE"
    ) {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }

        const streamerId =
            getDareStreamerId(
                dare
            );

        if (
            streamerId ===
            null
        ) {
            return;
        }

        activeDares[
            streamerKey(
                streamerId
            )
        ] = dare;

        removeFromQueue(
            getDareId(
                dare
            )
        );

        syncSelectedStreamer();
        renderCurrentDare();
        renderQueue();

        if (
            streamerKey(
                streamerId
            ) ===
            streamerKey(
                selectedStreamerId
            )
        ) {

            showToast(
                "🔥 Dare is now LIVE!"
            );
        }

        return;
    }


    if (
        message.type ===
        "QUEUE_UPDATED"
    ) {

        const streamerId =
            message.streamerId ??
            message.streamer_id ??
            message.streamer ??
            null;

        if (
            streamerId ===
            null
        ) {
            return;
        }

        const key =
            streamerKey(
                streamerId
            );

        queues[key] =
            Array.isArray(
                message.queue
            )
                ? [
                    ...message.queue
                ]
                : [];

        sortQueue(
            queues[key]
        );

        renderQueue();

        return;
    }


    if (
        message.type ===
        "DARE_COMPLETED"
    ) {

        if (
            message.dare
        ) {

            removeActiveDare(
                message.dare
            );
        }

        showToast(
            "✅ Dare completed!"
        );

        return;
    }


    if (
        message.type ===
        "DARE_FAILED"
    ) {

        if (
            message.dare
        ) {

            removeActiveDare(
                message.dare
            );
        }

        showToast(
            "❌ Dare failed."
        );

        return;
    }


    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        const streamerId =
            message.streamerId ??
            message.streamer_id ??
            message.streamer;

        if (
            streamerId !== null &&
            streamerId !== undefined
        ) {

            delete activeDares[
                streamerKey(
                    streamerId
                )
            ];
        }

        syncSelectedStreamer();
        renderCurrentDare();
        renderQueue();

        return;
    }


    if (
        message.type ===
        "DARE_REJECTED"
    ) {

        if (
            message.dare
        ) {

            removeFromQueue(
                getDareId(
                    message.dare
                )
            );
        }

        syncSelectedStreamer();
        renderQueue();

        showToast(
            "❌ Dare rejected."
        );

        return;
    }


    if (
        message.type ===
        "RESET"
    ) {

        activeDares = {};
        queues = {};
        currentDare = null;

        stopTimer();

        renderCurrentDare();
        renderQueue();

        return;
    }


    console.log(
        "⚠️ Unknown WebSocket message:",
        message.type
    );
}


/* ============================================================
   UPDATE LOCAL DARE
============================================================ */

function updateLocalDare(dare) {

    if (!dare) {
        return;
    }

    const streamerId =
        getDareStreamerId(
            dare
        );

    if (
        streamerId ===
        null
    ) {
        return;
    }

    const key =
        streamerKey(
            streamerId
        );

    const status =
        String(
            dare.status || ""
        ).toLowerCase();


    if (
        status ===
        "accepted"
    ) {

        activeDares[key] =
            dare;

        removeFromQueue(
            getDareId(
                dare
            )
        );

        return;
    }


    if (
        status ===
        "pending"
    ) {

        if (
            !queues[key]
        ) {
            queues[key] = [];
        }

        const id =
            getDareId(
                dare
            );

        const exists =
            queues[key].some(
                item =>
                    getDareId(
                        item
                    ) ===
                    id
            );

        if (!exists) {

            queues[key].push(
                dare
            );
        }

        sortQueue(
            queues[key]
        );
    }
}


/* ============================================================
   LOAD MY STREAMER
============================================================ */

async function loadMyStreamer() {

    try {

        const result =
            await authenticatedFetch(
                "/api/my-streamers"
            );

        console.log(
            "📡 My streamers response:",
            result
        );

        let streamers = [];

        if (
            Array.isArray(
                result?.streamers
            )
        ) {

            streamers =
                result.streamers;

        }

        else if (
            Array.isArray(
                result?.data?.streamers
            )
        ) {

            streamers =
                result.data.streamers;

        }

        else if (
            Array.isArray(
                result?.data
            )
        ) {

            streamers =
                result.data;
        }


        if (
            !streamers.length
        ) {

            myStreamer = null;
            selectedStreamerId = null;

            renderStreamerProfile();
            renderCurrentDare();
            renderQueue();

            showToast(
                "⚠️ No streamer profile found."
            );

            return;
        }


        myStreamer =
            streamers[0];

        selectedStreamerId =
            myStreamer.id;

        console.log(
            "🎥 My streamer:",
            myStreamer
        );

        console.log(
            "🆔 Streamer ID:",
            selectedStreamerId
        );

        renderStreamerProfile();
        syncSelectedStreamer();
        renderCurrentDare();
        renderQueue();

    }

    catch (error) {

        console.error(
            "❌ Failed to load streamer:",
            error
        );

        if (
            error.status ===
            401
        ) {

            clearAuthCache();

            window.location.href =
                "login.html";

            return;
        }

        showToast(
            "❌ Could not load your streamer profile."
        );
    }
}


/* ============================================================
   SYNC SELECTED STREAMER
============================================================ */

function syncSelectedStreamer() {

    if (
        selectedStreamerId === null ||
        selectedStreamerId === undefined
    ) {

        currentDare = null;

        return;
    }

    const key =
        streamerKey(
            selectedStreamerId
        );

    currentDare =
        activeDares[key] ||
        null;

    console.log(
        "🔄 Streamer ID:",
        selectedStreamerId
    );

    console.log(
        "🔥 Active dare:",
        currentDare
    );

    console.log(
        "⏳ Queue:",
        queues[key] || []
    );
}


/* ============================================================
   REMOVE ACTIVE DARE
============================================================ */

function removeActiveDare(dare) {

    if (!dare) {
        return;
    }

    const streamerId =
        getDareStreamerId(
            dare
        );

    const id =
        getDareId(
            dare
        );

    if (
        streamerId !==
        null
    ) {

        const key =
            streamerKey(
                streamerId
            );

        if (
            activeDares[key] &&
            getDareId(
                activeDares[key]
            ) === id
        ) {

            delete activeDares[key];
        }
    }


    if (
        currentDare &&
        getDareId(
            currentDare
        ) === id
    ) {

        currentDare = null;

        stopTimer();
    }

    syncSelectedStreamer();
    renderCurrentDare();
    renderQueue();
}


/* ============================================================
   RENDER ACTIVE DARE
============================================================ */

function renderCurrentDare() {

    stopTimer();

    if (
        !currentDare
    ) {

        currentDareElement.innerHTML = `
            <div class="empty">
                No active dare
            </div>
        `;

        return;
    }

    const dare =
        currentDare;

    const id =
        getDareId(
            dare
        );

    currentDareElement.innerHTML = `

        <div class="live-label">
            🔴 LIVE
        </div>

        <div class="meta">
            Viewer:
            <strong>
                ${escapeHtml(
                    dare.viewer ||
                    "Anonymous"
                )}
            </strong>
        </div>

        <div class="dare-text">
            ${escapeHtml(
                dareText(
                    dare
                )
            )}
        </div>

        <div class="meta">
            Reward:
            $${formatReward(
                dare.reward
            )}
        </div>

        <div class="meta">
            Duration:
            ${Number(
                dare.duration ||
                0
            )}
            seconds
        </div>

        <div
            id="timer"
            class="timer"
        >
            ${formatTime(
                Number(
                    dare.duration ||
                    0
                )
            )}
        </div>

        <div class="buttons">

            <button
                class="complete"
                onclick="
                    setDareStatus(
                        ${id},
                        'completed'
                    )
                "
            >
                ✅ COMPLETED
            </button>

            <button
                class="fail"
                onclick="
                    setDareStatus(
                        ${id},
                        'failed'
                    )
                "
            >
                ❌ FAILED
            </button>

        </div>
    `;

    startTimer(
        dare
    );
}


/* ============================================================
   TIMER
============================================================ */

function startTimer(dare) {

    stopTimer();

    let remaining =
        Number(
            dare.duration ||
            0
        );

    const timerElement =
        document.getElementById(
            "timer"
        );

    if (!timerElement) {
        return;
    }

    timerInterval =
        setInterval(
            () => {

                remaining--;

                if (
                    remaining <= 0
                ) {

                    stopTimer();

                    timerElement.textContent =
                        "TIME!";

                    return;
                }

                timerElement.textContent =
                    formatTime(
                        remaining
                    );

            },
            1000
        );
}


function stopTimer() {

    if (
        timerInterval
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }
}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Number(
                seconds
            ) || 0
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (
        String(
            minutes
        ).padStart(
            2,
            "0"
        )
        +
        ":"
        +
        String(
            secs
        ).padStart(
            2,
            "0"
        )
    );
}


/* ============================================================
   RENDER QUEUE
============================================================ */

function renderQueue() {

    const key =
        streamerKey(
            selectedStreamerId
        );

    const queue =
        queues[key] ||
        [];

    if (
        !queue.length
    ) {

        queueElement.innerHTML = `
            <div class="empty">
                No waiting dares
            </div>
        `;

        return;
    }

    sortQueue(
        queue
    );

    queueElement.innerHTML =
        "";

    queue.forEach(
        (dare, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "queue-item";

            const id =
                getDareId(
                    dare
                );

            item.innerHTML = `

                <div class="pending-label">
                    🟡 PENDING
                </div>

                <div class="queue-dare">

                    <span
                        class="queue-number"
                    >
                        #${index + 1}
                    </span>

                    ${escapeHtml(
                        dareText(
                            dare
                        )
                    )}

                </div>

                <div class="meta">

                    Viewer:

                    ${escapeHtml(
                        dare.viewer ||
                        "Anonymous"
                    )}

                </div>

                <div class="meta">

                    Duration:

                    ${Number(
                        dare.duration ||
                        0
                    )}s

                    ·

                    Reward:

                    $${formatReward(
                        dare.reward
                    )}

                </div>

                <div class="queue-buttons">

                    <button
                        class="accept"
                        onclick="
                            acceptDare(
                                ${id}
                            )
                        "
                    >
                        ✅ ACCEPT
                    </button>

                    <button
                        class="reject"
                        onclick="
                            rejectDare(
                                ${id}
                            )
                        "
                    >
                        ❌ REJECT
                    </button>

                </div>

            `;

            queueElement.appendChild(
                item
            );
        }
    );
}


/* ============================================================
   REMOVE FROM QUEUE
============================================================ */

function removeFromQueue(id) {

    if (
        id === null ||
        id === undefined
    ) {
        return;
    }

    const targetId =
        Number(id);

    Object.keys(
        queues
    ).forEach(
        key => {

            queues[key] =
                (
                    queues[key] ||
                    []
                ).filter(
                    dare =>
                        getDareId(
                            dare
                        ) !==
                        targetId
                );
        }
    );
}


/* ============================================================
   ACCEPT DARE
============================================================ */

async function acceptDare(id) {

    const dare =
        findDareInQueue(
            id
        );

    if (!dare) {

        showToast(
            "❌ Dare is no longer pending."
        );

        return;
    }

    if (
        currentDare
    ) {

        showToast(
            "⚠️ Finish the active dare first."
        );

        return;
    }

    await setDareStatus(
        id,
        "accepted"
    );
}


/* ============================================================
   REJECT DARE
============================================================ */

async function rejectDare(id) {

    await setDareStatus(
        id,
        "rejected"
    );
}


/* ============================================================
   STATUS UPDATE
============================================================ */

async function setDareStatus(
    id,
    status
) {

    const validStatuses = [
        "accepted",
        "rejected",
        "completed",
        "failed"
    ];

    if (
        !validStatuses.includes(
            status
        )
    ) {

        showToast(
            "❌ Invalid dare status."
        );

        return;
    }

    if (
        selectedStreamerId === null ||
        selectedStreamerId === undefined
    ) {

        showToast(
            "❌ No streamer profile loaded."
        );

        return;
    }

    try {

        const result =
            await authenticatedFetch(
                `/api/dare/${encodeURIComponent(
                    id
                )}/status`,
                {
                    method:
                        "POST",

                    body: {
                        status:
                            status
                    }
                }
            );

        if (!result) {
            return;
        }

        console.log(
            "📡 Status response:",
            result
        );


        if (
            status ===
            "accepted"
        ) {

            showToast(
                "🔥 Dare accepted!"
            );

        }

        else if (
            status ===
            "rejected"
        ) {

            showToast(
                "❌ Dare rejected!"
            );

        }

        else if (
            status ===
            "completed"
        ) {

            showToast(
                "✅ Dare completed."
            );

        }

        else {

            showToast(
                "❌ Dare marked as failed."
            );
        }

    }

    catch (error) {

        console.error(
            "❌ Status update error:",
            error
        );


        if (
            error.status ===
            401
        ) {

            showToast(
                "🔐 Please log in again."
            );

            clearAuthCache();

            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                800
            );

            return;
        }


        if (
            error.status ===
            403
        ) {

            showToast(
                "❌ You do not control this streamer."
            );

            return;
        }


        if (
            error.status ===
            404
        ) {

            showToast(
                "❌ Dare not found."
            );

            return;
        }


        if (
            error.status ===
            409
        ) {

            showToast(
                "⚠️ That dare can no longer be changed."
            );

            return;
        }


        showToast(
            "❌ " +
            (
                error.message ||
                "Failed to update dare."
            )
        );
    }
}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize() {

    try {

        const user =
            await requireLogin();

        if (!user) {
            return;
        }

        console.log(
            "👤 Nerve account:",
            user
        );


        await loadMyStreamer();


        if (
            !myStreamer
        ) {
            return;
        }


        connectWebSocket();

    }

    catch (error) {

        console.error(
            "❌ Controller initialization failed:",
            error
        );

        showToast(
            "❌ Could not initialize controller."
        );
    }
}


initialize();
