<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the page fit properly on phones -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>IRL Dare Controller</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 23px;
      font-weight: 800;
    }

    .irl-badge {
      background: #e53935;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    /* CONNECTION */

    .connection {
      background: #17171d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: #aaa;
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
    }

    .connection-dot.online {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* WAITING SCREEN */

    .waiting {
      background: #17171d;
      border-radius: 18px;
      padding: 70px 20px;
      text-align: center;
    }

    .waiting-icon {
      font-size: 55px;
      margin-bottom: 18px;
    }

    .waiting h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .waiting p {
      color: #888;
      font-size: 14px;
    }

    /* DARE SCREEN */

    .dare-screen {
      display: none;
    }

    .status {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .dare-card {
      background: #17171d;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .viewer {
      color: #888;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .viewer span {
      color: white;
      font-weight: 700;
    }

    .dare-text {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 20px;
      word-wrap: break-word;
    }

    .reward {
      font-size: 19px;
      font-weight: 800;
    }

    /* TIMER */

    .timer-box {
      background: #17171d;
      border-radius: 18px;
      text-align: center;
      padding: 20px;
      margin-bottom: 15px;
    }

    .timer-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .timer {
      font-size: 55px;
      font-weight: 900;
    }

    /* BUTTONS */

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 20px 10px;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
    }

    .accept {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .complete {
      background: #2563eb;
    }

    .fail {
      background: #9333ea;
    }

    .new-dare {
      background: #f59e0b;
      color: #111;
      width: 100%;
      margin-top: 12px;
    }

    /* HIDDEN */

    .hidden {
      display: none !important;
    }

    /* PHONE */

    @media (max-width: 380px) {

      .title {
        font-size: 20px;
      }

      .dare-text {
        font-size: 23px;
      }

      button {
        padding: 17px 8px;
        font-size: 15px;
      }

      .timer {
        font-size: 45px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="title">
      🎯 Dare Controller
    </div>

    <div class="irl-badge">
      IRL
    </div>

  </div>


  <!-- CONNECTION STATUS -->

  <div class="connection">

    <div id="connectionDot"
         class="connection-dot">
    </div>

    <div id="connectionText">
      Connecting...
    </div>

  </div>


  <!-- WAITING -->

  <div id="waitingScreen"
       class="waiting">

    <div class="waiting-icon">
      📡
    </div>

    <h2>
      Waiting for a dare
    </h2>

    <p>
      New dares will appear here.
    </p>

  </div>


  <!-- DARE -->

  <div id="dareScreen"
       class="dare-screen">

    <div id="status"
         class="status">
      NEW DARE
    </div>


    <!-- DARE INFORMATION -->

    <div class="dare-card">

      <div class="viewer">
        From:
        <span id="viewer">
          @viewer
        </span>
      </div>

      <div id="dareText"
           class="dare-text">

        Dare goes here

      </div>

      <div class="reward">

        💰 ₱<span id="reward">
          0
        </span>

      </div>

    </div>


    <!-- ACCEPT / REJECT -->

    <div id="decisionButtons"
         class="buttons">

      <button
        class="accept"
        onclick="acceptDare()">

        ✅ ACCEPT

      </button>

      <button
        class="reject"
        onclick="rejectDare()">

        ❌ REJECT

      </button>

    </div>


    <!-- TIMER -->

    <div id="timerArea"
         class="hidden">

      <div class="timer-box">

        <div class="timer-label">
          TIME REMAINING
        </div>

        <div id="timer"
             class="timer">

          30

        </div>

      </div>


      <!-- COMPLETE / FAIL -->

      <div class="buttons">

        <button
          class="complete"
          onclick="completeDare()">

          ✅ COMPLETE

        </button>

        <button
          class="fail"
          onclick="failDare()">

          🚫 FAIL

        </button>

      </div>

    </div>


    <!-- DEMO BUTTON -->

    <button
      id="newDareButton"
      class="new-dare"
      onclick="demoDare()">

      🧪 TEST NEW DARE

    </button>

  </div>

</div>


<script>

  /*
  ==================================================
  DARE CONTROLLER
  ==================================================

  This is currently DEMO MODE.

  Later we will connect this to your backend using
  WebSockets so Twitch dares appear automatically.
  */


  let currentDare = null;

  let timerInterval = null;

  let remainingTime = 30;


  /*
  ==================================================
  CONNECTION STATUS
  ==================================================
  */

  function setConnectionStatus(online) {

    const dot =
      document.getElementById("connectionDot");

    const text =
      document.getElementById("connectionText");


    if (online) {

      dot.classList.add("online");

      text.textContent =
        "Connected to Dare Server";

    } else {

      dot.classList.remove("online");

      text.textContent =
        "Demo Mode — Server not connected";

    }

  }


  /*
  ==================================================
  DEMO DARE
  ==================================================
  */

  function demoDare() {

    showDare({

      id: "demo-" + Date.now(),

      viewer: "Viewer123",

      text: "Do 20 push-ups",

      reward: 100,

      duration: 30

    });

  }


  /*
  ==================================================
  SHOW DARE
  ==================================================
  */

  function showDare(dare) {

    currentDare = dare;


    document
      .getElementById("waitingScreen")
      .classList.add("hidden");


    document
      .getElementById("dareScreen")
      .style.display = "block";


    document
      .getElementById("viewer")
      .textContent =
      "@" + dare.viewer;


    document
      .getElementById("dareText")
      .textContent =
      dare.text;


    document
      .getElementById("reward")
      .textContent =
      dare.reward;


    document
      .getElementById("status")
      .textContent =
      "NEW DARE";


    document
      .getElementById("decisionButtons")
      .classList.remove("hidden");


    document
      .getElementById("timerArea")
      .classList.add("hidden");


    document
      .getElementById("newDareButton")
      .classList.remove("hidden");

  }


  /*
  ==================================================
  ACCEPT DARE
  ==================================================
  */

  function acceptDare() {

    if (!currentDare) return;


    console.log(
      "DARE ACCEPTED:",
      currentDare
    );


    document
      .getElementById("status")
      .textContent =
      "🔥 DARE ACCEPTED";


    document
      .getElementById("decisionButtons")
      .classList.add("hidden");


    document
      .getElementById("newDareButton")
      .classList.add("hidden");


    document
      .getElementById("timerArea")
      .classList.remove("hidden");


    startTimer();


    /*
    ==============================================
    BACKEND CONNECTION WILL GO HERE

    Example:

    fetch("/api/dare/accept", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        dareId: currentDare.id
      })
    });

    ==============================================
    */

  }


  /*
  ==================================================
  REJECT DARE
  ==================================================
  */

  function rejectDare() {

    if (!currentDare) return;


    console.log(
      "DARE REJECTED:",
      currentDare
    );


    /*
    Backend will eventually receive:

    POST /api/dare/reject

    */


    resetController();

  }


  /*
  ==================================================
  TIMER
  ==================================================
  */

  function startTimer() {

    clearInterval(timerInterval);


    remainingTime =
      currentDare.duration || 30;


    updateTimer();


    timerInterval =
      setInterval(function () {

        remainingTime--;

        updateTimer();


        if (remainingTime <= 0) {

          clearInterval(timerInterval);


          document
            .getElementById("status")
            .textContent =
            "⏰ TIME'S UP";

        }

      }, 1000);

  }


  /*
  ==================================================
  UPDATE TIMER
  ==================================================
  */

  function updateTimer() {

    document
      .getElementById("timer")
      .textContent =
      remainingTime;

  }


  /*
  ==================================================
  COMPLETE DARE
  ==================================================
  */

  function completeDare() {

    if (!currentDare) return;


    clearInterval(timerInterval);


    console.log(
      "DARE COMPLETED:",
      currentDare
    );


    /*
    Backend:

    POST /api/dare/complete

    */


    resetController();

  }


  /*
  ==================================================
  FAIL DARE
  ==================================================
  */

  function failDare() {

    if (!currentDare) return;


    clearInterval(timerInterval);


    console.log(
      "DARE FAILED:",
      currentDare
    );


    /*
    Backend:

    POST /api/dare/fail

    */


    resetController();

  }


  /*
  ==================================================
  RESET
  ==================================================
  */

  function resetController() {

    clearInterval(timerInterval);


    currentDare = null;


    document
      .getElementById("dareScreen")
      .style.display = "none";


    document
      .getElementById("waitingScreen")
      .classList.remove("hidden");


    document
      .getElementById("newDareButton")
      .classList.remove("hidden");

  }


  /*
  ==================================================
  START
  ==================================================
  */

  // We're not connected to the server yet.
  setConnectionStatus(false);

</script>

</body>
</html>
