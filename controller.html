<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARE Controller</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08090c;
    --panel: #111318;
    --panel-2: #16181e;
    --border: #272a33;
    --text: #ffffff;
    --muted: #969ba8;
    --red: #ff2b2b;
    --red-dark: #c91f1f;
    --green: #20c76a;
    --yellow: #f5c542;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top right, rgba(255, 43, 43, 0.08), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    padding: 24px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--red), #8e1010);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 900;
    box-shadow: 0 0 25px rgba(255, 43, 43, 0.2);
}

.brand h1 {
    margin: 0;
    font-size: 25px;
    letter-spacing: -0.5px;
}

.brand p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* STATUS */

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
}

.connected {
    background: rgba(32, 199, 106, 0.12);
    color: #55e994;
    border: 1px solid rgba(32, 199, 106, 0.25);
}

.disconnected {
    background: rgba(255, 43, 43, 0.12);
    color: #ff7070;
    border: 1px solid rgba(255, 43, 43, 0.25);
}

/* CARDS */

.card {
    background: rgba(17, 19, 24, 0.96);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
}

.card h2 {
    margin: 0 0 18px;
    font-size: 17px;
    letter-spacing: 0.2px;
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.card-title h2 {
    margin: 0;
}

/* STREAMER */

.streamer-info {
    color: var(--muted);
    margin-bottom: 12px;
    font-size: 14px;
}

.streamer-info strong {
    color: white;
}

select,
input,
textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #30333d;
    background: #0c0e12;
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

select:focus,
input:focus,
textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255, 43, 43, 0.08);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

label {
    display: block;
    margin: 14px 0 7px;
    color: #c5c8d0;
    font-size: 13px;
    font-weight: 600;
}

/* FORM GRID */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

/* BUTTONS */

button {
    border: none;
    border-radius: 10px;
    padding: 12px 17px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition:
        transform 0.15s,
        opacity 0.15s,
        background 0.15s;
}

button:hover {
    transform: translateY(-1px);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.send {
    width: 100%;
    margin-top: 16px;
    background: var(--red);
    color: white;
}

.send:hover {
    background: #ff4141;
}

.accept {
    background: #178d4c;
    color: white;
}

.accept:hover {
    background: #20a85c;
}

.reject,
.fail {
    background: #a91f25;
    color: white;
}

.reject:hover,
.fail:hover {
    background: #c72a30;
}

.complete {
    background: #178d4c;
    color: white;
}

.complete:hover {
    background: #20a85c;
}

/* ACTIVE DARE */

.active-dare {
    border-color: rgba(255, 43, 43, 0.45);
    background:
        radial-gradient(circle at top right, rgba(255, 43, 43, 0.08), transparent 45%),
        var(--panel);
}

.live-label,
.pending-label {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.5px;
}

.live-label {
    background: rgba(255, 43, 43, 0.13);
    color: #ff6262;
    border: 1px solid rgba(255, 43, 43, 0.2);
}

.pending-label {
    background: rgba(245, 197, 66, 0.12);
    color: var(--yellow);
    border: 1px solid rgba(245, 197, 66, 0.2);
}

.dare-text {
    font-size: 27px;
    font-weight: 900;
    line-height: 1.3;
    margin: 18px 0;
    word-break: break-word;
}

.meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
}

.meta strong {
    color: #fff;
}

.timer {
    font-size: 50px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 1px;
    margin: 24px 0;
}

.buttons {
    display: flex;
    gap: 10px;
}

.buttons button {
    flex: 1;
}

/* QUEUE */

.queue-item {
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 17px;
    margin-bottom: 10px;
}

.queue-item:last-child {
    margin-bottom: 0;
}

.queue-item:hover {
    border-color: #393d49;
}

.queue-number {
    color: #ff5555;
    font-weight: 900;
    margin-right: 7px;
}

.queue-dare {
    margin-top: 11px;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 700;
    word-break: break-word;
}

.queue-buttons {
    display: flex;
    gap: 10px;
    margin-top: 13px;
}

.queue-buttons button {
    flex: 1;
}

.empty {
    color: #707582;
    text-align: center;
    padding: 25px 15px;
    border: 1px dashed #2b2e36;
    border-radius: 10px;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: #17191f;
    border: 1px solid #363944;
    padding: 12px 17px;
    border-radius: 10px;
    display: none;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    font-size: 14px;
    max-width: calc(100vw - 30px);
    text-align: center;
}

.toast.show {
    display: block;
    animation: toastIn 0.2s ease forwards;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

/* LOADING */

.loading {
    color: var(--muted);
    text-align: center;
    padding: 15px;
}

/* MOBILE */

@media (max-width: 700px) {
    body {
        padding: 14px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .status {
        align-self: flex-start;
    }

    .card {
        padding: 17px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .dare-text {
        font-size: 22px;
    }

    .timer {
        font-size: 40px;
    }

    .buttons,
    .queue-buttons {
        flex-direction: column;
    }

    .buttons button,
    .queue-buttons button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">
            <div class="brand-logo">D</div>

            <div>
                <h1>DARE Controller</h1>
                <p>Manage your live dare queue</p>
            </div>
        </div>

        <div
            id="connectionStatus"
            class="status disconnected"
        >
            🔴 Connecting...
        </div>

    </div>


    <!-- STREAMER -->

    <div class="card">

        <div class="card-title">
            <h2>🎥 CONTROLLING STREAMER</h2>
        </div>

        <div class="streamer-info">
            Streamer:
            <strong id="streamerName">
                Loading...
            </strong>
        </div>

        <select id="streamerSelect">
            <option value="">
                Loading streamers...
            </option>
        </select>

    </div>


    <!-- SEND TEST DARE -->

    <div class="card">

        <div class="card-title">
            <h2>➕ SEND TEST DARE</h2>
        </div>

        <label for="viewerInput">
            Viewer Name
        </label>

        <input
            id="viewerInput"
            type="text"
            maxlength="100"
            placeholder="Viewer name"
            value="TestViewer"
        >


        <label for="dareInput">
            Dare Text
        </label>

        <textarea
            id="dareInput"
            maxlength="1000"
            placeholder="Enter the dare..."
        ></textarea>


        <div class="form-grid">

            <div>

                <label for="durationInput">
                    Duration (seconds)
                </label>

                <input
                    id="durationInput"
                    type="number"
                    min="5"
                    max="300"
                    value="30"
                >

            </div>


            <div>

                <label for="rewardInput">
                    Reward
                </label>

                <input
                    id="rewardInput"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </div>

        </div>


        <button
            class="send"
            id="sendButton"
        >
            🚀 SEND DARE
        </button>

    </div>


    <!-- ACTIVE DARE -->

    <div class="card active-dare">

        <div class="card-title">
            <h2>🔥 ACTIVE DARE</h2>
        </div>

        <div id="currentDare">

            <div class="empty">
                No active dare
            </div>

        </div>

    </div>


    <!-- WAITING QUEUE -->

    <div class="card">

        <div class="card-title">
            <h2>⏳ WAITING QUEUE</h2>
        </div>

        <div id="queue">

            <div class="empty">
                No waiting dares
            </div>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<!-- AUTH MUST LOAD BEFORE CONTROLLER SCRIPT -->

<script src="auth.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* =========================================================
   STATE
========================================================= */

let ws = null;

let streamers = [];

let selectedStreamer = "";

let activeDares = {};

let queues = {};

let currentDare = null;

let timerInterval = null;

let reconnectTimer = null;

let toastTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const streamerSelect =
    document.getElementById(
        "streamerSelect"
    );

const streamerName =
    document.getElementById(
        "streamerName"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const queueElement =
    document.getElementById(
        "queue"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const dareInput =
    document.getElementById(
        "dareInput"
    );

const viewerInput =
    document.getElementById(
        "viewerInput"
    );

const durationInput =
    document.getElementById(
        "durationInput"
    );

const rewardInput =
    document.getElementById(
        "rewardInput"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   HELPERS
========================================================= */

function streamerKey(name) {

    return String(name || "")
        .trim()
        .toLowerCase();

}


function dareText(dare) {

    return dare?.dareText ||
           dare?.dare_text ||
           "";

}


function createdAt(dare) {

    return dare?.createdAt ||
           dare?.created_at ||
           0;

}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 2800);

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatReward(value) {

    const amount = Number(value || 0);

    if (!Number.isFinite(amount)) {
        return "0.00";
    }

    return amount.toFixed(2);

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    connectionStatus.textContent =
        "🟡 Connecting...";

    connectionStatus.className =
        "status disconnected";


    try {

        ws = new WebSocket(WS_URL);

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;

    }


    ws.onopen = function() {

        connectionStatus.textContent =
            "🟢 Connected";

        connectionStatus.className =
            "status connected";


        clearTimeout(reconnectTimer);


        try {

            ws.send(
                JSON.stringify({
                    type: "GET_STATE"
                })
            );

        } catch (error) {

            console.error(
                "GET_STATE error:",
                error
            );

        }

    };


    ws.onclose = function() {

        connectionStatus.textContent =
            "🔴 Disconnected";

        connectionStatus.className =
            "status disconnected";


        scheduleReconnect();

    };


    ws.onerror = function(error) {

        console.error(
            "WebSocket error:",
            error
        );

        connectionStatus.textContent =
            "🔴 Connection Error";

        connectionStatus.className =
            "status disconnected";

    };


    ws.onmessage = function(event) {

        try {

            const message =
                JSON.parse(
                    event.data
                );

            handleWebSocketMessage(
                message
            );

        } catch (error) {

            console.error(
                "WebSocket message error:",
                error
            );

        }

    };

}


function scheduleReconnect() {

    clearTimeout(reconnectTimer);

    reconnectTimer =
        setTimeout(() => {

            connectWebSocket();

        }, 3000);

}


/* =========================================================
   WEBSOCKET MESSAGE HANDLER
========================================================= */

function handleWebSocketMessage(message) {

    console.log(
        "WebSocket:",
        message
    );


    /* STATE */

    if (message.type === "STATE") {

        activeDares =
            message.active || {};

        queues =
            message.queues || {};


        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        return;

    }


    /* IMPORTANT:
       DARE_CREATED DOES NOT AUTO-ACCEPT.

       The backend decides whether a dare is
       immediately active or queued.
    */

    if (message.type === "DARE_CREATED") {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }


        updateLocalDare(dare);

        renderCurrentDare();

        renderQueue();

        return;

    }


    /* ACTIVE DARE */

    if (message.type === "ACTIVE_DARE") {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }


        const key =
            streamerKey(
                dare.streamer
            );


        activeDares[key] =
            dare;


        removeFromQueue(
            dare.id
        );


        if (
            key ===
            streamerKey(
                selectedStreamer
            )
        ) {

            currentDare =
                dare;

            renderCurrentDare();

        }


        renderQueue();

        showToast(
            "🔥 Dare is now LIVE!"
        );

        return;

    }


    /* QUEUE */

    if (message.type === "QUEUE_UPDATED") {

        const key =
            streamerKey(
                message.streamer
            );


        queues[key] =
            Array.isArray(
                message.queue
            )
                ? message.queue
                : [];


        renderQueue();

        return;

    }


    /* COMPLETED */

    if (message.type === "DARE_COMPLETED") {

        const dare =
            message.dare;

        if (dare) {

            removeActiveDare(
                dare
            );

        }


        showToast(
            "✅ Dare completed!"
        );

        return;

    }


    /* FAILED */

    if (message.type === "DARE_FAILED") {

        const dare =
            message.dare;

        if (dare) {

            removeActiveDare(
                dare
            );

        }


        showToast(
            "❌ Dare failed."
        );

        return;

    }


    /* ACTIVE CLEARED */

    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        const key =
            streamerKey(
                message.streamer
            );


        delete activeDares[key];


        if (
            key ===
            streamerKey(
                selectedStreamer
            )
        ) {

            currentDare =
                null;

            stopTimer();

        }


        renderCurrentDare();

        renderQueue();

        return;

    }


    /* REJECTED */

    if (
        message.type ===
        "DARE_REJECTED"
    ) {

        const dare =
            message.dare;

        if (dare) {

            removeFromQueue(
                dare.id
            );

        }


        renderQueue();

        showToast(
            "❌ Dare rejected."
        );

        return;

    }


    /* RESET */

    if (message.type === "RESET") {

        activeDares = {};

        queues = {};

        currentDare = null;

        stopTimer();

        renderCurrentDare();

        renderQueue();

    }

}


/* =========================================================
   LOCAL DARE STATE
========================================================= */

function updateLocalDare(dare) {

    if (!dare || !dare.streamer) {
        return;
    }


    const key =
        streamerKey(
            dare.streamer
        );


    if (dare.status === "accepted") {

        activeDares[key] =
            dare;

        removeFromQueue(
            dare.id
        );

        return;

    }


    if (dare.status === "pending") {

        if (!queues[key]) {
            queues[key] = [];
        }


        const exists =
            queues[key].some(
                item =>
                    item.id === dare.id
            );


        if (!exists) {

            queues[key].push(
                dare
            );

        }

        sortQueue(
            queues[key]
        );

    }

}


/* =========================================================
   STREAMERS
========================================================= */

async function loadStreamers() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/streamers",
                {
                    credentials: "include"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Failed to load streamers (${response.status})`
            );

        }


        const data =
            await response.json();


        if (Array.isArray(data)) {

            streamers = data;

        } else if (
            Array.isArray(data?.streamers)
        ) {

            streamers =
                data.streamers;

        } else if (
            Array.isArray(data?.data)
        ) {

            streamers =
                data.data;

        } else {

            streamers = [];

        }


        renderStreamers();

    } catch (error) {

        console.error(
            "Load streamers error:",
            error
        );


        streamers = [];

        renderStreamers();


        showToast(
            "⚠️ Could not load your streamers."
        );

    }

}


function renderStreamers() {

    streamerSelect.innerHTML = "";


    if (!streamers.length) {

        streamerSelect.innerHTML = `
            <option value="">
                No connected streamers
            </option>
        `;

        streamerName.textContent =
            "None";

        selectedStreamer = "";

        return;

    }


    streamers.forEach(
        streamer => {

            const username =
                streamer.username ||
                streamer.twitchUsername ||
                streamer.name ||
                "";

            if (!username) {
                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                username;


            option.textContent =
                streamer.displayName ||
                streamer.display_name ||
                username;


            streamerSelect.appendChild(
                option
            );

        }
    );


    const available =
        streamers
            .map(
                streamer =>
                    streamer.username ||
                    streamer.twitchUsername ||
                    streamer.name ||
                    ""
            )
            .filter(Boolean);


    if (
        !available.includes(
            selectedStreamer
        )
    ) {

        selectedStreamer =
            available[0] || "";

    }


    streamerSelect.value =
        selectedStreamer;


    streamerName.textContent =
        selectedStreamer ||
        "None";


    syncSelectedStreamer();

    renderCurrentDare();

    renderQueue();

}


/* =========================================================
   STREAMER CHANGE
========================================================= */

streamerSelect.addEventListener(
    "change",
    function() {

        selectedStreamer =
            streamerSelect.value;


        streamerName.textContent =
            selectedStreamer ||
            "None";


        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

    }
);


/* =========================================================
   SYNC SELECTED STREAMER
========================================================= */

function syncSelectedStreamer() {

    const key =
        streamerKey(
            selectedStreamer
        );


    currentDare =
        activeDares[key] ||
        null;

}


/* =========================================================
   ACTIVE DARE
========================================================= */

function removeActiveDare(dare) {

    if (!dare) {
        return;
    }


    const key =
        streamerKey(
            dare.streamer
        );


    if (
        activeDares[key] &&
        activeDares[key].id === dare.id
    ) {

        delete activeDares[key];

    }


    if (
        currentDare &&
        currentDare.id === dare.id
    ) {

        currentDare = null;

        stopTimer();

    }


    renderCurrentDare();

    renderQueue();

}


/* =========================================================
   RENDER ACTIVE DARE
========================================================= */

function renderCurrentDare() {

    stopTimer();


    if (!currentDare) {

        currentDareElement.innerHTML = `
            <div class="empty">
                No active dare
            </div>
        `;

        return;

    }


    const dare =
        currentDare;


    currentDareElement.innerHTML = `

        <div class="live-label">
            🔴 LIVE
        </div>

        <div class="meta">
            Viewer:
            <strong>
                ${escapeHtml(
                    dare.viewer ||
                    "Anonymous"
                )}
            </strong>
        </div>

        <div class="dare-text">
            ${escapeHtml(
                dareText(dare)
            )}
        </div>

        <div class="meta">
            Reward:
            ${formatReward(
                dare.reward
            )}
        </div>

        <div class="meta">
            Duration:
            ${Number(
                dare.duration || 0
            )} seconds
        </div>

        <div
            id="timer"
            class="timer"
        >
            ${formatTime(
                Number(
                    dare.duration || 0
                )
            )}
        </div>

        <div class="buttons">

            <button
                class="complete"
                onclick="
                    setDareStatus(
                        ${Number(dare.id)},
                        'completed'
                    )
                "
            >
                ✅ COMPLETED
            </button>

            <button
                class="fail"
                onclick="
                    setDareStatus(
                        ${Number(dare.id)},
                        'failed'
                    )
                "
            >
                ❌ FAILED
            </button>

        </div>
    `;


    startTimer(
        dare
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(dare) {

    stopTimer();


    let remaining =
        Number(
            dare.duration || 0
        );


    const timerElement =
        document.getElementById(
            "timer"
        );


    if (!timerElement) {
        return;
    }


    timerElement.textContent =
        formatTime(
            remaining
        );


    timerInterval =
        setInterval(() => {

            remaining--;


            if (remaining < 0) {

                stopTimer();

                timerElement.textContent =
                    "TIME!";

                return;

            }


            timerElement.textContent =
                formatTime(
                    remaining
                );

        }, 1000);

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }

}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


/* =========================================================
   QUEUE
========================================================= */

function sortQueue(queue) {

    queue.sort(
        (a, b) => {

            const aDate =
                new Date(
                    createdAt(a)
                );

            const bDate =
                new Date(
                    createdAt(b)
                );


            return aDate - bDate;

        }
    );

}


function renderQueue() {

    const key =
        streamerKey(
            selectedStreamer
        );


    const queue =
        queues[key] || [];


    if (!queue.length) {

        queueElement.innerHTML = `
            <div class="empty">
                No waiting dares
            </div>
        `;

        return;

    }


    sortQueue(queue);


    queueElement.innerHTML = "";


    queue.forEach(
        (dare, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "queue-item";


            item.innerHTML = `

                <div class="pending-label">
                    🟡 PENDING
                </div>

                <div class="queue-dare">

                    <span class="queue-number">
                        #${index + 1}
                    </span>

                    ${escapeHtml(
                        dareText(dare)
                    )}

                </div>

                <div class="meta">

                    Viewer:
                    ${escapeHtml(
                        dare.viewer ||
                        "Anonymous"
                    )}

                </div>

                <div class="meta">

                    Duration:
                    ${Number(
                        dare.duration || 0
                    )}s

                    · Reward:
                    ${formatReward(
                        dare.reward
                    )}

                </div>

                <div class="queue-buttons">

                    <button
                        class="accept"
                        onclick="
                            acceptDare(
                                ${Number(dare.id)}
                            )
                        "
                    >
                        ✅ ACCEPT
                    </button>

                    <button
                        class="reject"
                        onclick="
                            rejectDare(
                                ${Number(dare.id)}
                            )
                        "
                    >
                        ❌ REJECT
                    </button>

                </div>
            `;


            queueElement.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   QUEUE HELPERS
========================================================= */

function removeFromQueue(id) {

    Object.keys(
        queues
    ).forEach(
        key => {

            queues[key] =
                (
                    queues[key] ||
                    []
                ).filter(
                    dare =>
                        dare.id !== id
                );

        }
    );

}


function findDareInQueue(id) {

    for (
        const key of
        Object.keys(queues)
    ) {

        const found =
            (
                queues[key] ||
                []
            ).find(
                dare =>
                    dare.id === id
            );


        if (found) {
            return found;
        }

    }


    return null;

}


/* =========================================================
   ACCEPT DARE
========================================================= */

async function acceptDare(id) {

    const dare =
        findDareInQueue(
            id
        );


    if (!dare) {

        showToast(
            "❌ Dare is no longer pending."
        );

        return;

    }


    const active =
        activeDares[
            streamerKey(
                dare.streamer
            )
        ];


    if (active) {

        showToast(
            "⚠️ Finish the active dare first."
        );

        return;

    }


    await setDareStatus(
        id,
        "accepted"
    );

}


/* =========================================================
   REJECT DARE
========================================================= */

async function rejectDare(id) {

    await setDareStatus(
        id,
        "rejected"
    );

}


/* =========================================================
   SEND TEST DARE
========================================================= */

sendButton.addEventListener(
    "click",
    sendDare
);


async function sendDare() {

    const dareTextValue =
        dareInput.value.trim();


    const viewer =
        viewerInput.value.trim() ||
        "TestViewer";


    const duration =
        Number(
            durationInput.value
        );


    const reward =
        Number(
            rewardInput.value
        );


    if (!selectedStreamer) {

        showToast(
            "⚠️ Select a streamer first."
        );

        return;

    }


    if (!dareTextValue) {

        showToast(
            "⚠️ Enter a dare first."
        );

        dareInput.focus();

        return;

    }


    if (dareTextValue.length > 1000) {

        showToast(
            "⚠️ Dare is too long."
        );

        return;

    }


    if (
        !Number.isFinite(duration) ||
        duration < 5 ||
        duration > 300
    ) {

        showToast(
            "⚠️ Duration must be 5–300 seconds."
        );

        return;

    }


    if (
        !Number.isFinite(reward) ||
        reward < 0
    ) {

        showToast(
            "⚠️ Reward cannot be negative."
        );

        return;

    }


    sendButton.disabled = true;

    sendButton.textContent =
        "⏳ SENDING...";


    try {

        const response =
            await fetch(
                API_URL +
                "/api/dare",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            streamer:
                                selectedStreamer,

                            streamer_source:
                                "twitch_username",

                            viewer:
                                viewer,

                            dare_text:
                                dareTextValue,

                            duration:
                                duration,

                            reward:
                                reward

                        })

                }
            );


        let data = null;

        try {

            data =
                await response.json();

        } catch (_) {

            data = null;

        }


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                data?.error ||
                `Failed to send dare (${response.status})`
            );

        }


        dareInput.value = "";


        if (
            data?.dare?.status ===
            "accepted"
        ) {

            showToast(
                "🔥 Dare is now LIVE!"
            );

        } else {

            showToast(
                "🟡 Dare added to queue."
            );

        }


    } catch (error) {

        console.error(
            "Send dare error:",
            error
        );


        showToast(
            "❌ " +
            (
                error.message ||
                "Failed to send dare."
            )
        );


    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "🚀 SEND DARE";

    }

}


/* =========================================================
   SET DARE STATUS
========================================================= */

async function setDareStatus(
    id,
    status
) {

    const validStatuses = [
        "accepted",
        "rejected",
        "completed",
        "failed"
    ];


    if (
        !validStatuses.includes(
            status
        )
    ) {

        showToast(
            "❌ Invalid dare status."
        );

        return;

    }


    try {

        showToast(
            "⏳ Updating dare..."
        );


        const result =
            await authenticatedFetch(
                `/api/dare/${encodeURIComponent(id)}/status`,
                {
                    method: "POST",

                    body: {
                        status
                    }

                }
            );


        if (!result) {
            return;
        }


        if (
            status ===
            "accepted"
        ) {

            showToast(
                "🔥 Dare accepted and now LIVE!"
            );

        }


        else if (
            status ===
            "rejected"
        ) {

            showToast(
                "❌ Dare rejected."
            );

        }


        else if (
            status ===
            "completed"
        ) {

            showToast(
                "✅ Dare completed."
            );

        }


        else if (
            status ===
            "failed"
        ) {

            showToast(
                "❌ Dare marked as failed."
            );

        }


    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        if (
            error.status ===
            401
        ) {

            showToast(
                "🔐 Your session expired. Please log in again."
            );

            return;

        }


        if (
            error.status ===
            403
        ) {

            showToast(
                "❌ You do not control this streamer."
            );

            return;

        }


        if (
            error.status ===
            409
        ) {

            showToast(
                "⚠️ That dare can no longer be changed."
            );

            return;

        }


        showToast(
            "❌ " +
            (
                error.message ||
                "Failed to update dare."
            )
        );

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    try {

        /*
         * SECURITY:
         * Controller requires an authenticated
         * account before loading streamer controls.
         */

        const user =
            await requireLogin();


        if (!user) {
            return;
        }


        console.log(
            "Authenticated user:",
            user
        );


        await loadStreamers();

        connectWebSocket();


    } catch (error) {

        console.error(
            "Controller initialization failed:",
            error
        );


        showToast(
            "❌ Authentication failed. Please log in again."
        );


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1000);

    }

}


/* =========================================================
   START
========================================================= */

initialize();
