<script src="auth.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* =========================================================
   STATE
========================================================= */

let ws = null;

let streamers = [];

let selectedStreamer = "";

let activeDares = {};

let queues = {};

let currentDare = null;

let timerInterval = null;

let reconnectTimer = null;

let toastTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const streamerSelect =
    document.getElementById(
        "streamerSelect"
    );

const streamerName =
    document.getElementById(
        "streamerName"
    );

const currentDareElement =
    document.getElementById(
        "currentDare"
    );

const queueElement =
    document.getElementById(
        "queue"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const dareInput =
    document.getElementById(
        "dareInput"
    );

const viewerInput =
    document.getElementById(
        "viewerInput"
    );

const durationInput =
    document.getElementById(
        "durationInput"
    );

const rewardInput =
    document.getElementById(
        "rewardInput"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   HELPERS
========================================================= */

function streamerKey(name) {

    return String(name || "")
        .trim()
        .toLowerCase();

}


function dareText(dare) {

    return dare?.dareText ||
           dare?.dare_text ||
           "";

}


function createdAt(dare) {

    return dare?.createdAt ||
           dare?.created_at ||
           0;

}


function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2800);

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatReward(value) {

    const amount =
        Number(value || 0);

    return Number.isFinite(amount)
        ? amount.toFixed(2)
        : "0.00";

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    connectionStatus.textContent =
        "🟡 Connecting...";

    connectionStatus.className =
        "status disconnected";


    try {

        ws =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        connectionStatus.textContent =
            "🔴 Connection Error";

        scheduleReconnect();

        return;
    }


    ws.onopen = function() {

        console.log(
            "WebSocket connected."
        );

        connectionStatus.textContent =
            "🟢 Connected";

        connectionStatus.className =
            "status connected";

        clearTimeout(
            reconnectTimer
        );


        try {

            ws.send(
                JSON.stringify({
                    type: "GET_STATE"
                })
            );

        } catch (error) {

            console.error(
                "GET_STATE error:",
                error
            );

        }

    };


    ws.onclose = function(event) {

        console.warn(
            "WebSocket closed:",
            event.code,
            event.reason
        );

        connectionStatus.textContent =
            "🔴 Disconnected";

        connectionStatus.className =
            "status disconnected";

        scheduleReconnect();

    };


    ws.onerror = function(error) {

        console.error(
            "WebSocket error:",
            error
        );

        connectionStatus.textContent =
            "🔴 Connection Error";

    };


    ws.onmessage = function(event) {

        try {

            const message =
                JSON.parse(
                    event.data
                );

            handleWebSocketMessage(
                message
            );

        } catch (error) {

            console.error(
                "WebSocket message error:",
                error
            );

        }

    };

}


function scheduleReconnect() {

    clearTimeout(
        reconnectTimer
    );

    reconnectTimer =
        setTimeout(
            connectWebSocket,
            3000
        );

}


/* =========================================================
   WEBSOCKET MESSAGE HANDLER
========================================================= */

function handleWebSocketMessage(message) {

    console.log(
        "WebSocket:",
        message
    );


    if (message.type === "STATE") {

        activeDares =
            message.active || {};

        queues =
            message.queues || {};

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        return;
    }


    if (message.type === "DARE_CREATED") {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }

        updateLocalDare(
            dare
        );

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        return;
    }


    if (message.type === "ACTIVE_DARE") {

        const dare =
            message.dare;

        if (!dare) {
            return;
        }

        const key =
            streamerKey(
                dare.streamer
            );

        activeDares[key] =
            dare;

        removeFromQueue(
            dare.id
        );

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        showToast(
            "🔥 Dare is now LIVE!"
        );

        return;
    }


    if (message.type === "QUEUE_UPDATED") {

        const key =
            streamerKey(
                message.streamer
            );

        queues[key] =
            Array.isArray(
                message.queue
            )
                ? message.queue
                : [];

        renderQueue();

        return;
    }


    if (message.type === "DARE_COMPLETED") {

        if (message.dare) {
            removeActiveDare(
                message.dare
            );
        }

        showToast(
            "✅ Dare completed!"
        );

        return;
    }


    if (message.type === "DARE_FAILED") {

        if (message.dare) {
            removeActiveDare(
                message.dare
            );
        }

        showToast(
            "❌ Dare failed."
        );

        return;
    }


    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        const key =
            streamerKey(
                message.streamer
            );

        delete activeDares[key];

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

        return;
    }


    if (
        message.type ===
        "DARE_REJECTED"
    ) {

        if (message.dare) {

            removeFromQueue(
                message.dare.id
            );

        }

        renderQueue();

        showToast(
            "❌ Dare rejected."
        );

        return;
    }


    if (message.type === "RESET") {

        activeDares = {};

        queues = {};

        currentDare = null;

        stopTimer();

        renderCurrentDare();

        renderQueue();

    }

}


/* =========================================================
   LOCAL DARE STATE
========================================================= */

function updateLocalDare(dare) {

    if (
        !dare ||
        !dare.streamer
    ) {
        return;
    }

    const key =
        streamerKey(
            dare.streamer
        );


    if (
        dare.status ===
        "accepted"
    ) {

        activeDares[key] =
            dare;

        removeFromQueue(
            dare.id
        );

        return;
    }


    if (
        dare.status ===
        "pending"
    ) {

        if (!queues[key]) {
            queues[key] = [];
        }

        if (
            !queues[key].some(
                item =>
                    item.id === dare.id
            )
        ) {

            queues[key].push(
                dare
            );

        }

        sortQueue(
            queues[key]
        );

    }

}


/* =========================================================
   STREAMERS
========================================================= */

async function loadStreamers() {

    try {

        const result =
            await authenticatedFetch(
                "/api/my-streamers"
            );

        if (!result) {
            return;
        }


        let data =
            result?.data ||
            result;


        if (
            Array.isArray(data)
        ) {

            streamers =
                data;

        } else if (
            Array.isArray(
                data?.streamers
            )
        ) {

            streamers =
                data.streamers;

        } else {

            streamers = [];

        }


        renderStreamers();

    } catch (error) {

        console.error(
            "Load streamers error:",
            error
        );

        streamers = [];

        renderStreamers();

        showToast(
            "⚠️ Could not load your streamers."
        );

    }

}


function renderStreamers() {

    streamerSelect.innerHTML = "";


    if (!streamers.length) {

        streamerSelect.innerHTML = `
            <option value="">
                No connected streamers
            </option>
        `;

        streamerName.textContent =
            "None";

        selectedStreamer = "";

        return;
    }


    const available = [];


    streamers.forEach(
        streamer => {

            const username =
                streamer.username ||
                streamer.twitchUsername ||
                streamer.name ||
                "";

            if (!username) {
                return;
            }

            available.push(
                username
            );


            const option =
                document.createElement(
                    "option"
                );

            option.value =
                username;

            option.textContent =
                streamer.displayName ||
                streamer.display_name ||
                username;

            streamerSelect.appendChild(
                option
            );

        }
    );


    if (
        !available.includes(
            selectedStreamer
        )
    ) {

        selectedStreamer =
            available[0] || "";

    }


    streamerSelect.value =
        selectedStreamer;

    streamerName.textContent =
        selectedStreamer ||
        "None";


    syncSelectedStreamer();

    renderCurrentDare();

    renderQueue();

}


/* =========================================================
   STREAMER CHANGE
========================================================= */

streamerSelect.addEventListener(
    "change",
    function() {

        selectedStreamer =
            streamerSelect.value;

        streamerName.textContent =
            selectedStreamer ||
            "None";

        syncSelectedStreamer();

        renderCurrentDare();

        renderQueue();

    }
);


/* =========================================================
   SYNC
========================================================= */

function syncSelectedStreamer() {

    const key =
        streamerKey(
            selectedStreamer
        );

    currentDare =
        activeDares[key] ||
        null;

}


/* =========================================================
   ACTIVE DARE
========================================================= */

function removeActiveDare(dare) {

    if (!dare) {
        return;
    }

    const key =
        streamerKey(
            dare.streamer
        );


    if (
        activeDares[key] &&
        activeDares[key].id === dare.id
    ) {

        delete activeDares[key];

    }


    if (
        currentDare &&
        currentDare.id === dare.id
    ) {

        currentDare =
            null;

        stopTimer();

    }


    syncSelectedStreamer();

    renderCurrentDare();

    renderQueue();

}


/* =========================================================
   RENDER ACTIVE
========================================================= */

function renderCurrentDare() {

    stopTimer();


    if (!currentDare) {

        currentDareElement.innerHTML = `
            <div class="empty">
                No active dare
            </div>
        `;

        return;
    }


    const dare =
        currentDare;


    currentDareElement.innerHTML = `

        <div class="live-label">
            🔴 LIVE
        </div>

        <div class="meta">
            Viewer:
            <strong>
                ${escapeHtml(
                    dare.viewer ||
                    "Anonymous"
                )}
            </strong>
        </div>

        <div class="dare-text">
            ${escapeHtml(
                dareText(dare)
            )}
        </div>

        <div class="meta">
            Reward:
            ${formatReward(
                dare.reward
            )}
        </div>

        <div class="meta">
            Duration:
            ${Number(
                dare.duration || 0
            )} seconds
        </div>

        <div
            id="timer"
            class="timer"
        >
            ${formatTime(
                Number(
                    dare.duration || 0
                )
            )}
        </div>

        <div class="buttons">

            <button
                class="complete"
                onclick="
                    setDareStatus(
                        ${Number(dare.id)},
                        'completed'
                    )
                "
            >
                ✅ COMPLETED
            </button>

            <button
                class="fail"
                onclick="
                    setDareStatus(
                        ${Number(dare.id)},
                        'failed'
                    )
                "
            >
                ❌ FAILED
            </button>

        </div>
    `;


    startTimer(
        dare
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(dare) {

    stopTimer();


    let remaining =
        Number(
            dare.duration || 0
        );


    const timerElement =
        document.getElementById(
            "timer"
        );


    if (!timerElement) {
        return;
    }


    timerInterval =
        setInterval(
            () => {

                remaining--;

                if (
                    remaining < 0
                ) {

                    stopTimer();

                    timerElement.textContent =
                        "TIME!";

                    return;

                }

                timerElement.textContent =
                    formatTime(
                        remaining
                    );

            },
            1000
        );

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }

}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


/* =========================================================
   QUEUE
========================================================= */

function sortQueue(queue) {

    queue.sort(
        (a, b) => {

            const aDate =
                new Date(
                    createdAt(a)
                );

            const bDate =
                new Date(
                    createdAt(b)
                );

            return aDate - bDate;

        }
    );

}


function renderQueue() {

    const key =
        streamerKey(
            selectedStreamer
        );

    const queue =
        queues[key] || [];


    if (!queue.length) {

        queueElement.innerHTML = `
            <div class="empty">
                No waiting dares
            </div>
        `;

        return;
    }


    sortQueue(
        queue
    );

    queueElement.innerHTML =
        "";


    queue.forEach(
        (dare, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "queue-item";

            item.innerHTML = `

                <div class="pending-label">
                    🟡 PENDING
                </div>

                <div class="queue-dare">

                    <span class="queue-number">
                        #${index + 1}
                    </span>

                    ${escapeHtml(
                        dareText(dare)
                    )}

                </div>

                <div class="meta">
                    Viewer:
                    ${escapeHtml(
                        dare.viewer ||
                        "Anonymous"
                    )}
                </div>

                <div class="meta">
                    Duration:
                    ${Number(
                        dare.duration || 0
                    )}s
                    · Reward:
                    ${formatReward(
                        dare.reward
                    )}
                </div>

                <div class="queue-buttons">

                    <button
                        class="accept"
                        onclick="
                            acceptDare(
                                ${Number(dare.id)}
                            )
                        "
                    >
                        ✅ ACCEPT
                    </button>

                    <button
                        class="reject"
                        onclick="
                            rejectDare(
                                ${Number(dare.id)}
                            )
                        "
                    >
                        ❌ REJECT
                    </button>

                </div>
            `;

            queueElement.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   QUEUE HELPERS
========================================================= */

function removeFromQueue(id) {

    Object.keys(
        queues
    ).forEach(
        key => {

            queues[key] =
                (
                    queues[key] || []
                ).filter(
                    dare =>
                        dare.id !== id
                );

        }
    );

}


function findDareInQueue(id) {

    for (
        const key of
        Object.keys(queues)
    ) {

        const found =
            (
                queues[key] || []
            ).find(
                dare =>
                    dare.id === id
            );

        if (found) {
            return found;
        }

    }

    return null;

}


/* =========================================================
   ACCEPT
========================================================= */

async function acceptDare(id) {

    const dare =
        findDareInQueue(
            id
        );

    if (!dare) {

        showToast(
            "❌ Dare is no longer pending."
        );

        return;

    }


    const active =
        activeDares[
            streamerKey(
                dare.streamer
            )
        ];


    if (active) {

        showToast(
            "⚠️ Finish the active dare first."
        );

        return;

    }


    await setDareStatus(
        id,
        "accepted"
    );

}


/* =========================================================
   REJECT
========================================================= */

async function rejectDare(id) {

    await setDareStatus(
        id,
        "rejected"
    );

}


/* =========================================================
   SEND TEST DARE
========================================================= */

sendButton.addEventListener(
    "click",
    sendDare
);


async function sendDare() {

    const dareTextValue =
        dareInput.value.trim();

    const viewer =
        viewerInput.value.trim() ||
        "TestViewer";

    const duration =
        Number(
            durationInput.value
        );

    const reward =
        Number(
            rewardInput.value
        );


    if (!selectedStreamer) {

        showToast(
            "⚠️ Select a streamer first."
        );

        return;
    }


    if (!dareTextValue) {

        showToast(
            "⚠️ Enter a dare first."
        );

        dareInput.focus();

        return;
    }


    if (
        !Number.isFinite(duration) ||
        duration < 5 ||
        duration > 300
    ) {

        showToast(
            "⚠️ Duration must be 5–300 seconds."
        );

        return;
    }


    if (
        !Number.isFinite(reward) ||
        reward < 0
    ) {

        showToast(
            "⚠️ Reward cannot be negative."
        );

        return;
    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "⏳ SENDING...";


    try {

        const result =
            await authenticatedFetch(
                "/api/dare",
                {
                    method: "POST",

                    body: {
                        streamer:
                            selectedStreamer,

                        streamer_source:
                            "twitch_username",

                        viewer:
                            viewer,

                        dare_text:
                            dareTextValue,

                        duration:
                            duration,

                        reward:
                            reward
                    }
                }
            );


        if (!result) {
            return;
        }


        dareInput.value =
            "";

        const dare =
            result?.dare ||
            result?.data?.dare;


        if (
            dare?.status ===
            "accepted"
        ) {

            showToast(
                "🔥 Dare is now LIVE!"
            );

        } else {

            showToast(
                "🟡 Dare added to queue."
            );

        }

    } catch (error) {

        console.error(
            "Send dare error:",
            error
        );

        showToast(
            "❌ " +
            (
                error.message ||
                "Failed to send dare."
            )
        );

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "🚀 SEND DARE";

    }

}


/* =========================================================
   STATUS
========================================================= */

async function setDareStatus(
    id,
    status
) {

    const validStatuses = [
        "accepted",
        "rejected",
        "completed",
        "failed"
    ];


    if (
        !validStatuses.includes(
            status
        )
    ) {

        showToast(
            "❌ Invalid dare status."
        );

        return;
    }


    try {

        const result =
            await authenticatedFetch(
                `/api/dare/${encodeURIComponent(id)}/status`,
                {
                    method: "POST",

                    body: {
                        status
                    }
                }
            );


        if (!result) {
            return;
        }


        if (
            status ===
            "accepted"
        ) {

            showToast(
                "🔥 Dare accepted!"
            );

        } else if (
            status ===
            "rejected"
        ) {

            showToast(
                "❌ Dare rejected."
            );

        } else if (
            status ===
            "completed"
        ) {

            showToast(
                "✅ Dare completed."
            );

        } else {

            showToast(
                "❌ Dare marked as failed."
            );

        }

    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        if (
            error.status ===
            401
        ) {

            showToast(
                "🔐 Please log in again."
            );

            return;
        }


        if (
            error.status ===
            403
        ) {

            showToast(
                "❌ You do not control this streamer."
            );

            return;
        }


        if (
            error.status ===
            409
        ) {

            showToast(
                "⚠️ That dare can no longer be changed."
            );

            return;
        }


        showToast(
            "❌ " +
            (
                error.message ||
                "Failed to update dare."
            )
        );

    }

}

        console.log(

        );

        console.error(

            error
        );

        showToast(
            "❌ Could not initialize controller."
        );

    }

}


/* =========================================================
