<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DARE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:radial-gradient(900px 600px at 50% -15%, rgba(255,36,66,0.16), transparent 60%), radial-gradient(700px 500px at 90% 20%, rgba(120,60,255,0.08), transparent 60%), #06060a;color:white;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.bg-orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(40px);mix-blend-mode:screen}
.orb1{width:640px;height:640px;left:-180px;top:-180px;background:radial-gradient(circle, rgba(255,36,66,0.16), transparent 70%);animation:float 12s ease-in-out infinite}
.orb2{width:520px;height:520px;right:-120px;bottom:-120px;background:radial-gradient(circle, rgba(120,60,255,0.12), transparent 70%);animation:float 14s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,14px)}}
.container{width:100%;max-width:440px;position:relative}
.logo{text-align:center;margin-bottom:22px;animation:up 0.6s cubic-bezier(0.16,1,0.3,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo-mark{width:52px;height:52px;margin:0 auto 14px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#ff2442,#9b0f1f);box-shadow:0 10px 28px rgba(255,36,66,0.35);font-size:22px}
.logo h1{font-size:36px;letter-spacing:-2px;font-weight:900}
.logo p{color:#8b8ba0;font-size:13px;margin-top:4px}
.card{background:rgba(20,20,28,0.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);animation:up 0.6s cubic-bezier(0.16,1,0.3,1) 0.08s both}
.card h2{font-size:22px;letter-spacing:-0.6px}
.subtitle{color:#8b8ba0;font-size:13px;margin:6px 0 20px}
.field{margin-bottom:16px}
label{display:block;margin-bottom:7px;font-size:12px;font-weight:800;color:#e6e6eb;letter-spacing:-0.1px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.10);background:rgba(0,0,0,0.30);color:white;font-size:14px;outline:0;transition:border-color 0.2s, box-shadow 0.2s, transform 0.15s}
input::placeholder{color:#5f5f68}
input:focus{border-color:rgba(255,36,66,0.5);box-shadow:0 0 0 3px rgba(255,36,66,0.10);transform:translateY(-1px)}
.input-wrap{position:relative}
.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:var(--muted);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800;cursor:pointer}
.login-btn{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff2442,#c90f28);color:white;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(255,36,66,0.30), inset 0 1px 0 rgba(255,255,255,0.15);transition:transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(255,36,66,0.36)}
.login-btn:active{transform:scale(0.99)}
.login-btn:disabled{opacity:0.55;cursor:not-allowed;transform:none}
.message{display:none;margin-bottom:16px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.4}
.message.error{display:block;background:rgba(255,36,66,0.10);border:1px solid rgba(255,36,66,0.18);color:#ff8a95;animation:shake 0.4s cubic-bezier(0.16,1,0.3,1)}
.message.success{display:block;background:rgba(0,208,132,0.10);border:1px solid rgba(0,208,132,0.18);color:#7ee0b3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.bottom{text-align:center;margin-top:18px;color:#8b8ba0;font-size:13px}
.bottom a{color:#ff5a7a;font-weight:800;text-decoration:none}
.bottom a:hover{text-decoration:underline}
.back{display:block;text-align:center;margin-top:16px;color:#6a6a78;font-size:12px;text-decoration:none}
.back:hover{color:#9a9ab0}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#5a5a68;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase}
.divider i{flex:1;height:1px;background:rgba(255,255,255,0.06)}
.social{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:white;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.2s}
.social:hover{background:rgba(255,255,255,0.08)}
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<div class="container">
  <div class="logo"><div class="logo-mark">◆</div><h1>DARE</h1><p>Turn your stream into a challenge.</p></div>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to access your streamer dashboard.</p>
    <div id="message" class="message"></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><div class="input-wrap"><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="toggle" id="togglePw">Show</button></div></div>
      <button type="submit" class="login-btn" id="loginButton">Log In</button>
    </form>
    <div class="divider"><i></i> or <i></i></div>
    <button class="social" onclick="location.href='index.html'">← Back to DARE</button>
    <div class="bottom">Don't have an account? <a href="register.html">Create one</a></div>
    <a class="back" href="index.html">← Back to home</a>
  </div>
</div>
<script src="auth.js?v=999"></script>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton'),msg=document.getElementById('message'),pw=document.getElementById('password'),toggle=document.getElementById('togglePw');
toggle.addEventListener('click',()=>{pw.type=pw.type==='password'?'text':'password';toggle.textContent=pw.type==='password'?'Show':'Hide'});
function showMessage(t,type){msg.textContent=t;msg.className='message '+type}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim(),password=pw.value;
  if(!email||!password){showMessage('Please enter your email and password.','error');return}
  btn.disabled=true;btn.textContent='Logging in...';msg.className='message';msg.textContent='';
  try{
    const result=await login(email,password);
    if(result?.data?.user) localStorage.setItem('user',JSON.stringify(result.data.user));
    showMessage('✓ Login successful. Redirecting...','success');
    setTimeout(()=>location.href='controller.html',600);
  }catch(err){
    console.error(err);
    let m=err.message||'Unable to log in.';
    if(err.status===401) m='Invalid email or password.';
    showMessage(m,'error');btn.disabled=false;btn.textContent='Log In';
  }
});
</script>
</body>
</html>
