<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>IRL Dare Controller</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #101010;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #1b1b1b;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
    }

    .live {
      background: #e53935;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .dare-card {
      background: #252525;
      border-radius: 16px;
      padding: 25px 18px;
      margin-bottom: 20px;
    }

    .viewer {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .dare-text {
      font-size: 25px;
      line-height: 1.3;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .reward {
      font-size: 18px;
      font-weight: bold;
    }

    .timer {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .accept {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .complete {
      background: #2563eb;
    }

    .fail {
      background: #9333ea;
    }

    .hidden {
      display: none;
    }

    .waiting {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .waiting-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    @media (max-width: 350px) {
      .dare-text {
        font-size: 21px;
      }

      button {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">🎯 Dare Controller</div>
    <div class="live">IRL</div>
  </div>

  <!-- WAITING -->
  <div id="waitingScreen" class="waiting">
    <div class="waiting-icon">📡</div>
    <h2>Waiting for a dare...</h2>
    <p>New dares will appear here.</p>
  </div>

  <!-- DARE -->
  <div id="dareScreen" class="hidden">

    <div id="status" class="status">
      NEW DARE
    </div>

    <div class="dare-card">

      <div class="viewer">
        From: <strong id="viewer">@viewer</strong>
      </div>

      <div id="dareText" class="dare-text">
        Dare goes here
      </div>

      <div class="reward">
        💰 ₱<span id="reward">0</span>
      </div>

    </div>

    <!-- ACCEPT / REJECT -->
    <div id="decisionButtons" class="buttons">
      <button class="accept" onclick="acceptDare()">
        ✅ ACCEPT
      </button>

      <button class="reject" onclick="rejectDare()">
        ❌ REJECT
      </button>
    </div>

    <!-- TIMER -->
    <div id="timerArea" class="hidden">

      <div id="timer" class="timer">
        30
      </div>

      <div class="buttons">

        <button class="complete" onclick="completeDare()">
          ✅ COMPLETE
        </button>

        <button class="fail" onclick="failDare()">
          🚫 FAIL
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  let currentDare = null;
  let timerInterval = null;
  let remainingTime = 30;


  /*
  ==========================================
  DEMO DARE
  ==========================================
  Remove this when connecting your backend.
  */

  function demoDare() {

    showDare({
      id: "123",
      viewer: "Viewer123",
      text: "Do 20 push-ups",
      reward: 100,
      duration: 30
    });

  }


  /*
  ==========================================
  SHOW DARE
  ==========================================
  */

  function showDare(dare) {

    currentDare = dare;

    document
      .getElementById("waitingScreen")
      .classList.add("hidden");

    document
      .getElementById("dareScreen")
      .classList.remove("hidden");

    document.getElementById("viewer")
      .textContent = "@" + dare.viewer;

    document.getElementById("dareText")
      .textContent = dare.text;

    document.getElementById("reward")
      .textContent = dare.reward;

    document.getElementById("status")
      .textContent = "NEW DARE";

    document
      .getElementById("decisionButtons")
      .classList.remove("hidden");

    document
      .getElementById("timerArea")
      .classList.add("hidden");
  }


  /*
  ==========================================
  ACCEPT
  ==========================================
  */

  function acceptDare() {

    if (!currentDare) return;

    console.log("DARE ACCEPTED:", currentDare);

    document.getElementById("status")
      .textContent = "🔥 DARE ACCEPTED";

    document
      .getElementById("decisionButtons")
      .classList.add("hidden");

    document
      .getElementById("timerArea")
      .classList.remove("hidden");

    startTimer();

    /*
      Later we'll send this to your backend:

      fetch("/api/dare/accept", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          dareId: currentDare.id
        })
      });
    */
  }


  /*
  ==========================================
  REJECT
  ==========================================
  */

  function rejectDare() {

    if (!currentDare) return;

    console.log("DARE REJECTED:", currentDare);

    /*
      Later:

      fetch("/api/dare/reject", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          dareId: currentDare.id
        })
      });
    */

    resetController();
  }


  /*
  ==========================================
  TIMER
  ==========================================
  */

  function startTimer() {

    remainingTime = currentDare.duration || 30;

    updateTimer();

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

      remainingTime--;

      updateTimer();

      if (remainingTime <= 0) {

        clearInterval(timerInterval);

        document.getElementById("status")
          .textContent = "⏰ TIME'S UP";

      }

    }, 1000);
  }


  function updateTimer() {

    document.getElementById("timer")
      .textContent = remainingTime;
  }


  /*
  ==========================================
  COMPLETE
  ==========================================
  */

  function completeDare() {

    clearInterval(timerInterval);

    console.log("DARE COMPLETED:", currentDare);

    /*
      Later:

      fetch("/api/dare/complete", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          dareId: currentDare.id
        })
      });
    */

    resetController();
  }


  /*
  ==========================================
  FAIL
  ==========================================
  */

  function failDare() {

    clearInterval(timerInterval);

    console.log("DARE FAILED:", currentDare);

    /*
      Later:

      fetch("/api/dare/fail", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          dareId: currentDare.id
        })
      });
    */

    resetController();
  }


  /*
  ==========================================
  RESET
  ==========================================
  */

  function resetController() {

    clearInterval(timerInterval);

    currentDare = null;

    document
      .getElementById("dareScreen")
      .classList.add("hidden");

    document
      .getElementById("waitingScreen")
      .classList.remove("hidden");
  }


  /*
  ==========================================
  DEMO
  ==========================================
  */

  setTimeout(() => {
    demoDare();
  }, 1500);

</script>

</body>
</html>
