<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dare System Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0b0b0f;

      color: white;

      font-family: Arial, sans-serif;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;

      background: #17171d;

      border-radius: 20px;

      padding: 25px;

      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      border: none;

      border-radius: 10px;

      background: #25252d;

      color: white;

      font-size: 16px;
    }

    textarea {
      min-height: 100px;

      resize: vertical;
    }

    button {
      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 12px;

      background: #16a34a;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 18px;

      color: #aaa;

      font-size: 14px;

      word-break: break-word;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🎯 Dare System Test</h1>

  <input
    id="viewer"
    type="text"
    placeholder="Viewer name"
    value="TestViewer"
  >

  <textarea
    id="dare"
    placeholder="Enter a harmless test dare"
  >Test the IRL Dare System</textarea>

  <input
    id="duration"
    type="number"
    placeholder="Duration"
    value="30"
    min="5"
    max="300"
  >

  <button onclick="sendDare()">
    🚀 SEND TEST DARE
  </button>

  <div id="status">
    Ready
  </div>

</div>


<script>

const BACKEND_URL =
  "https://dare-backend-vx8w.onrender.com";


async function sendDare() {

  const viewer =
    document.getElementById("viewer").value;

  const text =
    document.getElementById("dare").value;

  const duration =
    Number(
      document.getElementById("duration").value
    );


  const status =
    document.getElementById("status");


  if (!text.trim()) {

    status.textContent =
      "Please enter a test dare.";

    return;

  }


  status.textContent =
    "Sending...";


  try {

    const response =
      await fetch(
        BACKEND_URL + "/api/dare",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            viewer: viewer || "TestViewer",

            text: text,

            duration: duration || 30

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server returned an error."
      );

    }


    status.textContent =
      "✅ Test dare sent successfully!";


    console.log(
      "Dare:",
      data.dare
    );


  } catch (error) {

    console.error(error);


    status.textContent =
      "❌ Error: " + error.message;

  }

}

</script>

</body>
</html>
