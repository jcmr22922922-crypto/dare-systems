<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — DARE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:radial-gradient(900px 600px at 50% -15%, rgba(255,36,66,0.15), transparent 60%), radial-gradient(700px 500px at 90% 20%, rgba(120,60,255,0.08), transparent 60%), #06060a;color:white;display:flex;align-items:center;justify-content:center;padding:24px}
.bg-orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(40px);mix-blend-mode:screen}
.orb1{width:640px;height:640px;left:-180px;top:-180px;background:radial-gradient(circle, rgba(255,36,66,0.14), transparent 70%)}
.orb2{width:520px;height:520px;right:-120px;bottom:-120px;background:radial-gradient(circle, rgba(120,60,255,0.10), transparent 70%)}
.container{width:100%;max-width:460px;position:relative}
.logo{text-align:center;margin-bottom:20px}
.logo-mark{width:48px;height:48px;margin:0 auto 12px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#ff2442,#9b0f1f);box-shadow:0 10px 28px rgba(255,36,66,0.35);font-size:20px}
.logo h1{font-size:32px;letter-spacing:-1.6px;font-weight:900}
.logo p{color:#8b8ba0;font-size:13px;margin-top:4px}
.card{background:rgba(20,20,28,0.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
.field{margin-bottom:16px}
label{display:block;margin-bottom:7px;color:#e6e6eb;font-size:12px;font-weight:800}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.10);background:rgba(0,0,0,0.30);color:white;font-size:14px;outline:0;transition:border-color 0.2s, box-shadow 0.2s}
input::placeholder{color:#5f5f68}
input:focus{border-color:rgba(255,36,66,0.5);box-shadow:0 0 0 3px rgba(255,36,66,0.10)}
.hint{margin-top:6px;color:#6a6a78;font-size:11px}
.strength{height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:8px}
.strength i{display:block;height:100%;width:0;border-radius:999px;transition:width 0.35s, background 0.35s}
button.primary{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff2442,#c90f28);color:white;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(255,36,66,0.30);transition:transform 0.2s}
button.primary:hover{transform:translateY(-1px)}
button.primary:disabled{opacity:0.55;cursor:not-allowed;transform:none}
.message{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;text-align:center}
.message.error{display:block;background:rgba(255,36,66,0.10);border:1px solid rgba(255,36,66,0.18);color:#ff8a95;animation:shake 0.4s}
.message.success{display:block;background:rgba(0,208,132,0.10);border:1px solid rgba(0,208,132,0.18);color:#7ee0b3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.login-link{margin-top:18px;text-align:center;color:#8b8ba0;font-size:13px}
.login-link a{color:#ff5a7a;font-weight:800;text-decoration:none}
.login-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<div class="container">
  <div class="logo"><div class="logo-mark">◆</div><h1>DARE</h1><p>Create your streamer account</p></div>
  <div class="card">
    <form id="registerForm" novalidate>
      <div class="field"><label for="username">Username</label><input id="username" type="text" minlength="3" maxlength="50" autocomplete="username" pattern="[A-Za-z0-9_]+" placeholder="Your username" required><div class="hint">3–50 characters. Letters, numbers and underscores.</div></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="320" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Create a password" required><div class="strength"><i id="strengthBar"></i></div><div class="hint" id="strengthText">8–128 characters. Use a strong password.</div></div>
      <div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter it again" required></div>
      <button id="registerButton" type="submit" class="primary">CREATE ACCOUNT</button>
      <div id="message" class="message"></div>
    </form>
    <div class="login-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script src="auth.js?v=2"></script>
<script>
const form=document.getElementById('registerForm'),btn=document.getElementById('registerButton'),msg=document.getElementById('message'),pw=document.getElementById('password'),bar=document.getElementById('strengthBar'),txt=document.getElementById('strengthText'),confirm=document.getElementById('confirmPassword');
function strength(p){
  let s=0;
  if(p.length>=8) s++;
  if(p.length>=12) s++;
  if(/[A-Z]/.test(p) && /[a-z]/.test(p)) s++;
  if(/[0-9]/.test(p)) s++;
  if(/[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(s,4);
}
pw.addEventListener('input',()=>{
  const v=pw.value, s=strength(v);
  const pct=[0,25,50,75,100][s];
  const col=['transparent','#ff4d6a','#f6ad55','#7ee0b3','#00d084'][s];
  bar.style.width=pct+'%';bar.style.background=col;
  txt.textContent=['Weak — keep going','Fair','Good','Strong','Very strong'][s] || '8–128 characters.';
  txt.style.color=s>=3?'#7ee0b3':s>=2?'#ffd166':'#8b8ba0';
});
function showMessage(t,type){msg.textContent=t;msg.className='message '+type}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=pw.value;
  const confirmPassword=confirm.value;
  if(!/^[A-Za-z0-9_]{3,50}$/.test(username)){showMessage('Username must be 3–50 chars using letters, numbers, underscores.','error');return}
  if(password.length<8||password.length>128){showMessage('Password must be 8–128 characters.','error');return}
  if(password!==confirmPassword){showMessage('Passwords do not match.','error');return}
  btn.disabled=true;btn.textContent='CREATING ACCOUNT...';msg.className='message';
  try{
    await register(username,email,password);
    showMessage('✓ Account created. Redirecting to login...','success');
    setTimeout(()=>location.href='login.html',900);
  }catch(err){
    console.error(err);
    showMessage(err.message||'Unable to create account.','error');
    btn.disabled=false;btn.textContent='CREATE ACCOUNT';
  }
});
</script>
</body>
</html>
