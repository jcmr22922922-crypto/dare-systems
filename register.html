<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - DARE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #301010,
                    #0b0b0d 55%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;

            padding: 40px;

            background:
                rgba(20, 20, 23, .96);

            border:
                1px solid #303036;

            border-radius: 18px;

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, .65);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;

            font-size: 36px;
            font-weight: 900;

            color: #ff3b3b;
        }

        .logo p {
            margin-top: 8px;

            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #ccc;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border:
                1px solid #38383f;

            border-radius: 10px;

            background: #0e0e11;
            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #ff3b3b;

            box-shadow:
                0 0 0 3px
                rgba(255, 59, 59, .12);
        }

        .hint {
            margin-top: 6px;

            color: #666;

            font-size: 12px;
        }

        button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: 0;
            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ff3030,
                    #d91515
                );

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            box-shadow:
                0 10px 30px
                rgba(255, 40, 40, .25);
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 14px;

            text-align: center;
        }

        .message.error {
            display: block;

            color: #ff7777;

            background:
                rgba(255, 50, 50, .1);

            border:
                1px solid
                rgba(255, 50, 50, .25);
        }

        .message.success {
            display: block;

            color: #70ff9a;

            background:
                rgba(50, 255, 120, .08);

            border:
                1px solid
                rgba(50, 255, 120, .2);
        }

        .login-link {
            margin-top: 22px;

            color: #888;

            font-size: 14px;

            text-align: center;
        }

        .login-link a {
            color: #ff5555;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">

        <h1>DARE</h1>

        <p>
            Create your account
        </p>

    </div>


    <form id="registerForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                minlength="3"
                maxlength="50"
                autocomplete="username"
                pattern="[A-Za-z0-9_]+"
                placeholder="Your username"
                required
            >

            <div class="hint">
                3–50 characters. Letters, numbers and underscores.
            </div>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                maxlength="320"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Create a password"
                required
            >

            <div class="hint">
                8–128 characters.
            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Enter it again"
                required
            >

        </div>


        <button
            id="registerButton"
            type="submit"
        >
            CREATE ACCOUNT
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Log in
        </a>

    </div>

</div>


<script src="auth.js?v=2"></script>

<script>

const form =
    document.getElementById(
        "registerForm"
    );

const button =
    document.getElementById(
        "registerButton"
    );

const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        `message ${type}`;
}


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const username =
            document
                .getElementById(
                    "username"
                )
                .value
                .trim();

        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById(
                    "password"
                )
                .value;

        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        if (
            !/^[A-Za-z0-9_]{3,50}$/
                .test(username)
        ) {

            showMessage(
                "Username must be 3–50 characters using letters, numbers, and underscores.",
                "error"
            );

            return;
        }


        if (
            password.length < 8 ||
            password.length > 128
        ) {

            showMessage(
                "Password must be 8–128 characters.",
                "error"
            );

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "CREATING ACCOUNT...";

        message.className =
            "message";


        try {

            await register(
                username,
                email,
                password
            );

            showMessage(
                "Account created. Redirecting to login...",
                "success"
            );

            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                900
            );

        } catch (error) {

            console.error(
                "Registration failed:",
                error
            );

            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );

            button.disabled =
                false;

            button.textContent =
                "CREATE ACCOUNT";
        }

    }
);

</script>

</body>
</html>
