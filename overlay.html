<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dare Stream Overlay</title>


<style>

/* ==========================================
   RESET
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* ==========================================
   PAGE
========================================== */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==========================================
   OVERLAY
========================================== */

#overlay {

    position: absolute;

    top: 30px;
    right: 30px;

    width: 360px;

    display: none;

    animation:
        slideIn
        .35s
        ease;

}


/* ==========================================
   CARD
========================================== */

.dare-card {

    background:
        rgba(12, 12, 18, .95);

    border:
        2px solid
        rgba(255,255,255,.12);

    border-radius: 18px;

    padding: 20px;

    color: white;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.5);

}


/* ==========================================
   HEADER
========================================== */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 14px;

}


.title {

    font-size: 18px;

    font-weight: 900;

}


.status {

    padding:
        5px 9px;

    border-radius:
        7px;

    font-size:
        10px;

    font-weight:
        900;

    background:
        #e53935;

}


/* ==========================================
   VIEWER
========================================== */

.viewer {

    color:
        #888;

    font-size:
        13px;

    margin-bottom:
        10px;

}


.viewer span {

    color:
        white;

    font-weight:
        800;

}


/* ==========================================
   DARE TEXT
========================================== */

.dare-text {

    font-size:
        23px;

    line-height:
        1.25;

    font-weight:
        900;

    margin-bottom:
        15px;

    word-break:
        break-word;

}


/* ==========================================
   DETAILS
========================================== */

.details {

    display:
        flex;

    gap:
        10px;

    margin-bottom:
        15px;

}


.detail {

    background:
        rgba(255,255,255,.07);

    border-radius:
        8px;

    padding:
        8px 10px;

    color:
        #aaa;

    font-size:
        12px;

    font-weight:
        700;

}


.detail span {

    color:
        white;

}


/* ==========================================
   TIMER
========================================== */

.timer-container {

    margin-top:
        8px;

}


.timer-label {

    color:
        #888;

    font-size:
        10px;

    font-weight:
        900;

    margin-bottom:
        4px;

}


.timer {

    font-size:
        34px;

    font-weight:
        900;

}


.progress-background {

    width:
        100%;

    height:
        6px;

    margin-top:
        8px;

    background:
        rgba(255,255,255,.12);

    border-radius:
        10px;

    overflow:
        hidden;

}


.progress {

    width:
        100%;

    height:
        100%;

    background:
        white;

    transition:
        width
        1s
        linear;

}


/* ==========================================
   RESULT
========================================== */

#result {

    display:
        none;

    text-align:
        center;

    font-size:
        21px;

    font-weight:
        900;

    padding-top:
        10px;

}


/* ==========================================
   ANIMATION
========================================== */

@keyframes slideIn {

    from {

        opacity:
            0;

        transform:
            translateX(40px);

    }

    to {

        opacity:
            1;

        transform:
            translateX(0);

    }

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:500px) {

    #overlay {

        top:
            15px;

        right:
            15px;

        width:
            calc(100% - 30px);

        max-width:
            360px;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     OVERLAY CARD
========================================== -->

<div id="overlay">

    <div class="dare-card">


        <div class="header">

            <div class="title">
                🎯 DARE
            </div>


            <div
                id="status"
                class="status">

                NEW

            </div>

        </div>


        <div class="viewer">

            From:

            <span id="viewer">
                @viewer
            </span>

        </div>


        <div
            id="dareText"
            class="dare-text">

            Dare goes here

        </div>


        <div class="details">

            <div class="detail">

                💰 ₱<span id="reward">
                    0
                </span>

            </div>


            <div class="detail">

                ⏱️ <span id="duration">
                    30
                </span>s

            </div>

        </div>


        <div
            id="timerContainer"
            class="timer-container">

            <div class="timer-label">

                TIME REMAINING

            </div>


            <div
                id="timer"
                class="timer">

                30

            </div>


            <div class="progress-background">

                <div
                    id="progress"
                    class="progress">
                </div>

            </div>

        </div>


        <div id="result">
        </div>


    </div>

</div>


<script>

/* ==========================================
   BACKEND
========================================== */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* ==========================================
   STATE
========================================== */

let currentDare =
    null;

let timerInterval =
    null;

let remainingTime =
    30;

let totalDuration =
    30;


/* ==========================================
   ELEMENTS
========================================== */

const overlay =
    document.getElementById(
        "overlay"
    );

const status =
    document.getElementById(
        "status"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const dareText =
    document.getElementById(
        "dareText"
    );

const reward =
    document.getElementById(
        "reward"
    );

const duration =
    document.getElementById(
        "duration"
    );

const timer =
    document.getElementById(
        "timer"
    );

const progress =
    document.getElementById(
        "progress"
    );

const timerContainer =
    document.getElementById(
        "timerContainer"
    );

const result =
    document.getElementById(
        "result"
    );


/* ==========================================
   CONNECT
========================================== */

let socket;


function connect() {

    console.log(
        "Connecting to Dare Server..."
    );


    socket =
        new WebSocket(
            WS_URL
        );


    socket.onopen =
        function() {

            console.log(
                "Dare overlay connected"
            );

        };


    socket.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                console.log(
                    "Overlay message:",
                    message
                );


                handleMessage(
                    message
                );

            }

            catch(error) {

                console.error(
                    "Invalid message:",
                    error
                );

            }

        };


    socket.onclose =
        function() {

            console.log(
                "Overlay disconnected"
            );


            setTimeout(
                connect,
                2000
            );

        };


    socket.onerror =
        function(error) {

            console.error(
                "Overlay WebSocket error:",
                error
            );

        };

}


/* ==========================================
   SERVER MESSAGES
========================================== */

function handleMessage(
    message
) {


    /* ==============================
       INITIAL STATE
    ============================== */

    if (
        message.type ===
        "STATE"
    ) {

        if (
            message.currentDare
        ) {

            showDare(
                message.currentDare
            );

        }

        else {

            hideOverlay();

        }

        return;

    }


    /* ==============================
       NEW DARE
    ============================== */

    if (
        message.type ===
        "NEW_DARE"
    ) {

        showDare(
            message.dare
        );

        return;

    }


    /* ==============================
       STATUS
    ============================== */

    if (
        message.type ===
        "DARE_STATUS"
    ) {

        if (
            message.dare
        ) {

            updateStatus(
                message.dare
            );

        }

        return;

    }


    /* ==============================
       CLEARED
    ============================== */

    if (
        message.type ===
        "DARE_CLEARED"
    ) {

        hideOverlay();

        return;

    }


    /* ==============================
       RESET
    ============================== */

    if (
        message.type ===
        "RESET"
    ) {

        hideOverlay();

        return;

    }

}


/* ==========================================
   SHOW DARE
========================================== */

function showDare(
    dare
) {

    if (!dare) {

        return;

    }


    currentDare =
        dare;


    totalDuration =
        Number(
            dare.duration
        ) || 30;


    remainingTime =
        totalDuration;


    viewer.textContent =
        "@" +
        (
            dare.viewer ||
            "Anonymous"
        );


    dareText.textContent =
        dare.text ||
        "";


    reward.textContent =
        dare.reward ||
        0;


    duration.textContent =
        totalDuration;


    result.style.display =
        "none";


    timerContainer.style.display =
        "block";


    overlay.style.display =
        "block";


    updateStatus(
        dare
    );


    updateTimer();


    clearInterval(
        timerInterval
    );

}


/* ==========================================
   STATUS UPDATE
========================================== */

function updateStatus(
    dare
) {

    currentDare =
        dare;


    const dareStatus =
        dare.status ||
        "pending";


    status.textContent =
        dareStatus.toUpperCase();


    if (
        dareStatus ===
        "accepted"
    ) {

        status.style.background =
            "#16a34a";


        startTimer();

    }


    else if (
        dareStatus ===
        "rejected"
    ) {

        status.style.background =
            "#dc2626";


        showResult(
            "❌ DARE REJECTED"
        );

    }


    else if (
        dareStatus ===
        "completed"
    ) {

        status.style.background =
            "#2563eb";


        showResult(
            "✅ DARE COMPLETED"
        );

    }


    else if (
        dareStatus ===
        "failed"
    ) {

        status.style.background =
            "#9333ea";


        showResult(
            "🚫 DARE FAILED"
        );

    }


    else {

        status.style.background =
            "#e53935";


        clearInterval(
            timerInterval
        );

    }

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    remainingTime =
        totalDuration;


    updateTimer();


    timerInterval =
        setInterval(
            function() {

                remainingTime--;


                updateTimer();


                if (
                    remainingTime <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    status.textContent =
                        "TIME'S UP";


                    status.style.background =
                        "#f59e0b";

                }

            },

            1000

        );

}


/* ==========================================
   UPDATE TIMER
========================================== */

function updateTimer() {

    timer.textContent =
        Math.max(
            remainingTime,
            0
        );


    const percentage =
        (
            remainingTime /
            totalDuration
        ) * 100;


    progress.style.width =
        Math.max(
            percentage,
            0
        ) + "%";

}


/* ==========================================
   RESULT
========================================== */

function showResult(
    message
) {

    clearInterval(
        timerInterval
    );


    timerContainer.style.display =
        "none";


    result.textContent =
        message;


    result.style.display =
        "block";


    setTimeout(
        hideOverlay,
        3000
    );

}


/* ==========================================
   HIDE
========================================== */

function hideOverlay() {

    clearInterval(
        timerInterval
    );


    overlay.style.display =
        "none";


    currentDare =
        null;

}


/* ==========================================
   START
========================================== */

connect();

</script>

</body>

</html>
