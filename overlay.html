<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DARE Overlay</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   OVERLAY POSITION
========================================================= */

#overlay {
    position: fixed;
    top: 30px;
    right: 30px;

    width: 420px;

    display: none;

    z-index: 999999;

    animation:
        slideIn 0.45s ease-out;
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

    position: relative;

    width: 100%;

    padding: 22px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(20, 20, 30, 0.97),
            rgba(10, 10, 16, 0.97)
        );

    border:
        2px solid
        rgba(108, 99, 255, 0.9);

    box-shadow:
        0 0 25px
        rgba(108, 99, 255, 0.35),

        0 15px 45px
        rgba(0, 0, 0, 0.55);

}


/* =========================================================
   TOP HEADER
========================================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

}


.title {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 0.5px;

}


.live {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding:
        5px
        9px;

    border-radius: 7px;

    background:
        rgba(220, 38, 38, 0.18);

    color:
        #ff6464;

    border:
        1px solid
        rgba(255, 80, 80, 0.35);

    font-size: 11px;

    font-weight: 900;

}


.live-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #ff4444;

    animation:
        pulse 1s infinite;

}


/* =========================================================
   VIEWER
========================================================= */

.viewer {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 8px;

}

.viewer strong {

    color: white;

}


/* =========================================================
   DARE TEXT
========================================================= */

.dare {

    font-size: 27px;

    line-height: 1.25;

    font-weight: 900;

    color: white;

    margin:
        12px
        0
        18px;

    word-wrap: break-word;

}


/* =========================================================
   INFO
========================================================= */

.info {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 18px;

}


.info-box {

    flex: 1;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(255, 255, 255, 0.05);

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    text-align: center;

}


.info-label {

    display: block;

    color: #888;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    margin-bottom: 4px;

}


.info-value {

    display: block;

    color: white;

    font-size: 16px;

    font-weight: 800;

}


/* =========================================================
   TIMER
========================================================= */

.timer-container {

    margin-top: 5px;

}


.timer {

    text-align: center;

    font-size: 48px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: 2px;

    color: white;

    margin-bottom: 12px;

}


.timer.warning {

    color: #ffd43b;

}


.timer.danger {

    color: #ff5555;

    animation:
        timerPulse 0.7s infinite;

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress {

    width: 100%;

    height: 8px;

    border-radius: 20px;

    overflow: hidden;

    background:
        rgba(255, 255, 255, 0.1);

}


.progress-bar {

    width: 100%;

    height: 100%;

    border-radius: 20px;

    background: #6c63ff;

    transition:
        width 1s linear;

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 13px;

    text-align: center;

    color: #777;

    font-size: 11px;

}


/* =========================================================
   RESULT
========================================================= */

#result {

    position: fixed;

    top: 30px;
    right: 30px;

    width: 420px;

    display: none;

    z-index: 999999;

    animation:
        slideIn 0.45s ease-out;
}


.result-card {

    width: 100%;

    padding: 25px;

    border-radius: 18px;

    background:
        rgba(15, 15, 22, 0.97);

    border:
        2px solid
        rgba(108, 99, 255, 0.8);

    box-shadow:
        0 0 30px
        rgba(108, 99, 255, 0.3),

        0 15px 45px
        rgba(0, 0, 0, 0.55);

    text-align: center;

}


.result-icon {

    font-size: 48px;

    margin-bottom: 8px;

}


.result-title {

    font-size: 25px;

    font-weight: 900;

    color: white;

}


.result-subtitle {

    margin-top: 8px;

    color: #999;

    font-size: 14px;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes slideIn {

    from {

        opacity: 0;

        transform:
            translateX(80px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateX(0)
            scale(1);

    }

}


@keyframes slideOut {

    from {

        opacity: 1;

        transform:
            translateX(0)
            scale(1);

    }

    to {

        opacity: 0;

        transform:
            translateX(80px)
            scale(0.95);

    }

}


@keyframes pulse {

    0%,
    100% {

        opacity: 1;

        transform: scale(1);

    }

    50% {

        opacity: 0.4;

        transform: scale(0.75);

    }

}


@keyframes timerPulse {

    0%,
    100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.05);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #overlay,
    #result {

        top: 15px;

        right: 15px;

        left: 15px;

        width: auto;

    }


    .card {

        padding: 18px;

    }


    .dare {

        font-size: 23px;

    }


    .timer {

        font-size: 40px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     ACTIVE DARE
======================================================= -->

<div id="overlay">

    <div class="card">

        <div class="header">

            <div class="title">
                🎯 DARE CHALLENGE
            </div>

            <div class="live">

                <span class="live-dot"></span>

                LIVE

            </div>

        </div>


        <div class="viewer">

            Viewer:

            <strong id="viewer">
                Anonymous
            </strong>

        </div>


        <div
            id="dare"
            class="dare"
        >
            Loading dare...
        </div>


        <div class="info">

            <div class="info-box">

                <span class="info-label">
                    Reward
                </span>

                <span
                    id="reward"
                    class="info-value"
                >
                    ₱0.00
                </span>

            </div>


            <div class="info-box">

                <span class="info-label">
                    Duration
                </span>

                <span
                    id="duration"
                    class="info-value"
                >
                    30s
                </span>

            </div>

        </div>


        <div class="timer-container">

            <div
                id="timer"
                class="timer"
            >
                00:30
            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </div>


        <div class="footer">

            Complete the dare before the timer runs out!

        </div>

    </div>

</div>


<!-- =======================================================
     RESULT
======================================================= -->

<div id="result">

    <div class="result-card">

        <div
            id="resultIcon"
            class="result-icon"
        >
            ✅
        </div>

        <div
            id="resultTitle"
            class="result-title"
        >
            DARE COMPLETED
        </div>

        <div
            id="resultSubtitle"
            class="result-subtitle"
        >
            Nice job!
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* =========================================================
   ELEMENTS
========================================================= */

const overlay =
    document.getElementById(
        "overlay"
    );

const result =
    document.getElementById(
        "result"
    );

const viewerElement =
    document.getElementById(
        "viewer"
    );

const dareElement =
    document.getElementById(
        "dare"
    );

const rewardElement =
    document.getElementById(
        "reward"
    );

const durationElement =
    document.getElementById(
        "duration"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const resultIcon =
    document.getElementById(
        "resultIcon"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultSubtitle =
    document.getElementById(
        "resultSubtitle"
    );


/* =========================================================
   STATE
========================================================= */

let ws = null;

let reconnectTimer = null;

let timerInterval = null;

let currentDareId = null;

let currentDare = null;

let remainingSeconds = 0;

let totalSeconds = 0;


/* =========================================================
   HELPERS
========================================================= */

function getDareText(dare) {

    if (!dare) {
        return "";
    }

    return (
        dare.dareText ||
        dare.dare_text ||
        ""
    );

}


function streamerKey(name) {

    return String(
        name || ""
    )
    .trim()
    .toLowerCase();

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


/* =========================================================
   SHOW DARE
========================================================= */

function showDare(dare) {

    if (!dare) {

        console.warn(
            "[DARE OVERLAY] No dare received."
        );

        return;

    }


    console.log(
        "[DARE OVERLAY] SHOWING DARE:",
        dare
    );


    currentDare =
        dare;

    currentDareId =
        dare.id;


    stopTimer();


    result.style.display =
        "none";


    overlay.style.display =
        "block";


    /* -------------------------------------------------------
       VIEWER
    ------------------------------------------------------- */

    viewerElement.textContent =
        dare.viewer ||
        "Anonymous";


    /* -------------------------------------------------------
       DARE TEXT
    ------------------------------------------------------- */

    dareElement.textContent =
        getDareText(
            dare
        );


    /* -------------------------------------------------------
       REWARD
    ------------------------------------------------------- */

    const reward =
        Number(
            dare.reward || 0
        );


    rewardElement.textContent =
        "₱" +
        reward.toFixed(2);


    /* -------------------------------------------------------
       DURATION
    ------------------------------------------------------- */

    totalSeconds =
        Math.max(
            1,
            Number(
                dare.duration || 30
            )
        );


    remainingSeconds =
        totalSeconds;


    durationElement.textContent =
        totalSeconds +
        "s";


    updateTimer();


    /* -------------------------------------------------------
       RESET ANIMATION
    ------------------------------------------------------- */

    overlay.style.animation =
        "none";

    void overlay.offsetWidth;

    overlay.style.animation =
        "slideIn 0.45s ease-out";


    /* -------------------------------------------------------
       START TIMER
    ------------------------------------------------------- */

    timerInterval =
        setInterval(
            () => {

                remainingSeconds--;

                updateTimer();


                if (
                    remainingSeconds <= 0
                ) {

                    stopTimer();

                    timerElement.textContent =
                        "TIME!";

                }

            },
            1000
        );

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer() {

    timerElement.textContent =
        formatTime(
            remainingSeconds
        );


    timerElement.classList.remove(
        "warning",
        "danger"
    );


    if (
        remainingSeconds <= 5
    ) {

        timerElement.classList.add(
            "danger"
        );

    } else if (
        remainingSeconds <= 10
    ) {

        timerElement.classList.add(
            "warning"
        );

    }


    const percentage =
        Math.max(
            0,
            Math.min(
                100,
                (
                    remainingSeconds /
                    totalSeconds
                ) * 100
            )
        );


    progressBar.style.width =
        percentage +
        "%";

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}


/* =========================================================
   HIDE OVERLAY
========================================================= */

function hideOverlay() {

    stopTimer();

    currentDare =
        null;

    currentDareId =
        null;


    overlay.style.animation =
        "slideOut 0.35s ease-in";


    setTimeout(
        () => {

            overlay.style.display =
                "none";

        },
        350
    );

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(
    type,
    dare
) {

    stopTimer();

    overlay.style.display =
        "none";


    if (
        type ===
        "completed"
    ) {

        resultIcon.textContent =
            "✅";

        resultTitle.textContent =
            "DARE COMPLETED";

        resultSubtitle.textContent =
            "The dare was completed successfully.";

    } else {

        resultIcon.textContent =
            "❌";

        resultTitle.textContent =
            "DARE FAILED";

        resultSubtitle.textContent =
            "The dare was marked as failed.";

    }


    result.style.display =
        "block";


    result.style.animation =
        "none";

    void result.offsetWidth;

    result.style.animation =
        "slideIn 0.45s ease-out";


    /*
       Automatically hide the result
       after 3 seconds.
    */

    setTimeout(
        () => {

            result.style.animation =
                "slideOut 0.35s ease-in";


            setTimeout(
                () => {

                    result.style.display =
                        "none";

                },
                350
            );

        },
        3000
    );

}


/* =========================================================
   PROCESS INITIAL STATE
========================================================= */

function processInitialState(
    message
) {

    console.log(
        "[DARE OVERLAY] STATE:",
        message
    );


    /*
       Backend state format:

       {
           type: "STATE",
           active: {
               streamer: dare
           },
           queues: {}
       }
    */


    const active =
        message.active ||
        {};


    /*
       We only need the active dare.

       If there is an active dare,
       display the first one.
    */

    const keys =
        Object.keys(
            active
        );


    if (!keys.length) {

        hideOverlay();

        return;

    }


    const dare =
        active[
            keys[0]
        ];


    if (!dare) {

        hideOverlay();

        return;

    }


    showDare(
        dare
    );

}


/* =========================================================
   WEBSOCKET MESSAGE HANDLER
========================================================= */

function handleMessage(
    message
) {

    console.log(
        "[DARE OVERLAY] MESSAGE:",
        message
    );


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    if (
        message.type ===
        "STATE"
    ) {

        processInitialState(
            message
        );

        return;

    }


    /* =====================================================
       NEW DARE CREATED
    ===================================================== */

    if (
        message.type ===
        "DARE_CREATED"
    ) {

        const dare =
            message.dare;


        if (!dare) {

            return;

        }


        console.log(
            "[DARE OVERLAY] DARE_CREATED:",
            dare
        );


        /*
           IMPORTANT:

           If the backend creates the dare
           as ACCEPTED, this message may
           arrive before ACTIVE_DARE.

           We only show it immediately if
           it is already accepted/live.

           If it is still pending, we wait
           for ACTIVE_DARE.
        */

        if (
            dare.status ===
            "accepted"
        ) {

            showDare(
                dare
            );

        }


        return;

    }


    /* =====================================================
       ACTIVE DARE
    ===================================================== */

    if (
        message.type ===
        "ACTIVE_DARE"
    ) {

        const dare =
            message.dare;


        if (!dare) {

            return;

        }


        console.log(
            "🔥 [DARE OVERLAY] ACTIVE DARE:",
            dare
        );


        showDare(
            dare
        );


        return;

    }


    /* =====================================================
       DARE COMPLETED
    ===================================================== */

    if (
        message.type ===
        "DARE_COMPLETED"
    ) {

        console.log(
            "✅ [DARE OVERLAY] COMPLETED"
        );


        showResult(
            "completed",
            message.dare
        );


        return;

    }


    /* =====================================================
       DARE FAILED
    ===================================================== */

    if (
        message.type ===
        "DARE_FAILED"
    ) {

        console.log(
            "❌ [DARE OVERLAY] FAILED"
        );


        showResult(
            "failed",
            message.dare
        );


        return;

    }


    /* =====================================================
       ACTIVE DARE CLEARED
    ===================================================== */

    if (
        message.type ===
        "ACTIVE_DARE_CLEARED"
    ) {

        console.log(
            "[DARE OVERLAY] ACTIVE CLEARED"
        );


        /*
           Only hide if this event refers
           to the currently displayed dare.
        */

        hideOverlay();

        return;

    }


    /* =====================================================
       REJECTED
    ===================================================== */

    if (
        message.type ===
        "DARE_REJECTED"
    ) {

        /*
           Rejected dares should never
           be displayed.
        */

        return;

    }


    /* =====================================================
       RESET
    ===================================================== */

    if (
        message.type ===
        "RESET"
    ) {

        hideOverlay();

        result.style.display =
            "none";

        return;

    }

}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    console.log(
        "[DARE OVERLAY] Connecting..."
    );


    try {

        ws =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(
            "[DARE OVERLAY] WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;

    }


    ws.onopen =
        function() {

            console.log(
                "🟢 [DARE OVERLAY] WebSocket connected."
            );


            /*
               Ask backend for the current state.

               This is important if the overlay
               loads AFTER a dare has already
               become active.
            */

            try {

                ws.send(
                    JSON.stringify({
                        type:
                            "GET_STATE"
                    })
                );

            } catch (error) {

                console.error(
                    "[DARE OVERLAY] GET_STATE error:",
                    error
                );

            }

        };


    ws.onmessage =
        function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                handleMessage(
                    message
                );

            } catch (error) {

                console.error(
                    "[DARE OVERLAY] Invalid WebSocket message:",
                    error
                );

            }

        };


    ws.onerror =
        function(error) {

            console.error(
                "[DARE OVERLAY] WebSocket error:",
                error
            );

        };


    ws.onclose =
        function() {

            console.warn(
                "🔴 [DARE OVERLAY] WebSocket disconnected."
            );


            scheduleReconnect();

        };

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (reconnectTimer) {

        return;

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            3000
        );

}


/* =========================================================
   START
========================================================= */

console.log(
    "🎯 DARE OVERLAY STARTING..."
);

console.log(
    "WebSocket:",
    WS_URL
);


connectWebSocket();

</script>

</body>

</html>
