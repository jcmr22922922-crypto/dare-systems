<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dare Overlay</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

#overlay {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 360px;
    display: none;
}

.dare-card {
    background: rgba(12, 12, 18, 0.96);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 20px;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    animation: slideIn 0.35s ease-out;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.title {
    font-size: 18px;
    font-weight: 900;
}

.status {
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 900;
    background: #16a34a;
}

.viewer {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.viewer span {
    color: white;
    font-weight: 800;
}

.dare-text {
    font-size: 23px;
    line-height: 1.25;
    font-weight: 900;
    margin-bottom: 15px;
    word-break: break-word;
}

.details {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.detail {
    background: rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 8px 10px;
    color: #aaa;
    font-size: 12px;
    font-weight: 700;
}

.detail span {
    color: white;
}

.timer-label {
    color: #888;
    font-size: 10px;
    font-weight: 900;
    margin-bottom: 4px;
}

.timer {
    font-size: 34px;
    font-weight: 900;
}

.progress-background {
    width: 100%;
    height: 6px;
    margin-top: 8px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    width: 100%;
    height: 100%;
    background: white;
    transition: width 1s linear;
}

#result {
    display: none;
    text-align: center;
    font-size: 21px;
    font-weight: 900;
    padding-top: 10px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(40px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@media(max-width:500px) {
    #overlay {
        top: 15px;
        right: 15px;
        width: calc(100% - 30px);
        max-width: 360px;
    }
}
</style>
</head>

<body>

<div id="overlay">

    <div class="dare-card">

        <div class="header">
            <div class="title">🎯 DARE</div>

            <div id="status" class="status">
                ACCEPTED
            </div>
        </div>

        <div class="viewer">
            From:
            <span id="viewer">@viewer</span>
        </div>

        <div id="dareText" class="dare-text">
            Dare goes here
        </div>

        <div class="details">

            <div class="detail">
                💰 ₱<span id="reward">0.00</span>
            </div>

            <div class="detail">
                ⏱️ <span id="duration">30</span>s
            </div>

        </div>

        <div id="timerContainer">

            <div class="timer-label">
                TIME REMAINING
            </div>

            <div id="timer" class="timer">
                30
            </div>

            <div class="progress-background">
                <div id="progress" class="progress"></div>
            </div>

        </div>

        <div id="result"></div>

    </div>

</div>

<script>

/* =========================================================
   BACKEND
========================================================= */

const WS_URL =
    "wss://dare-backend-vx8w.onrender.com/ws";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let currentDare = null;

let timerInterval = null;

let resultTimeout = null;

let totalDuration = 30;

let remainingTime = 30;


/* =========================================================
   ELEMENTS
========================================================= */

const overlay =
    document.getElementById("overlay");

const status =
    document.getElementById("status");

const viewer =
    document.getElementById("viewer");

const dareText =
    document.getElementById("dareText");

const reward =
    document.getElementById("reward");

const duration =
    document.getElementById("duration");

const timer =
    document.getElementById("timer");

const progress =
    document.getElementById("progress");

const timerContainer =
    document.getElementById("timerContainer");

const result =
    document.getElementById("result");


/* =========================================================
   CONNECT TO WEBSOCKET
========================================================= */

function connect() {

    console.log(
        "[DARE OVERLAY] Connecting..."
    );

    socket = new WebSocket(WS_URL);


    socket.onopen = function() {

        console.log(
            "[DARE OVERLAY] Connected!"
        );

        socket.send(
            JSON.stringify({
                type: "GET_STATE"
            })
        );

    };


    socket.onmessage = function(event) {

        try {

            const message =
                JSON.parse(event.data);

            console.log(
                "[DARE OVERLAY] Received:",
                message
            );

            handleMessage(message);

        }

        catch(error) {

            console.error(
                "[DARE OVERLAY] Invalid message:",
                error
            );

        }

    };


    socket.onerror = function(error) {

        console.error(
            "[DARE OVERLAY] WebSocket error:",
            error
        );

    };


    socket.onclose = function() {

        console.log(
            "[DARE OVERLAY] Disconnected. Reconnecting..."
        );

        setTimeout(
            connect,
            3000
        );

    };

}


/* =========================================================
   HANDLE MESSAGES
========================================================= */

function handleMessage(message) {


    /* =====================================================
       INITIAL STATE

       BACKEND FORMAT:

       {
           type: "STATE",
           active: {
               "streamer": dare
           },
           queues: {...}
       }
    ===================================================== */

    if (message.type === "STATE") {

        console.log(
            "[DARE OVERLAY] STATE:",
            message
        );


        const active =
            message.active || {};


        /*
         * The backend stores active dares
         * by streamer username.
         *
         * We need to find the active dare.
         */

        const activeKeys =
            Object.keys(active);


        if (activeKeys.length > 0) {

            const dare =
                active[activeKeys[0]];


            if (dare) {

                console.log(
                    "[DARE OVERLAY] Found active dare:",
                    dare
                );

                showDare(dare);

                return;

            }

        }


        hideOverlay();

        return;
    }


    /* =====================================================
       NEW DARE

       DO NOT SHOW.

       It must be accepted first.
    ===================================================== */

    if (message.type === "DARE_CREATED") {

        console.log(
            "[DARE OVERLAY] Pending dare received."
        );

        return;
    }


    /* =====================================================
       ACCEPTED DARE

       THIS IS WHAT MAKES THE OVERLAY APPEAR.
    ===================================================== */

    if (message.type === "ACTIVE_DARE") {

        console.log(
            "[DARE OVERLAY] ACTIVE DARE:",
            message.dare
        );


        if (message.dare) {

            showDare(
                message.dare
            );

        }

        return;
    }


    /* =====================================================
       REJECTED
    ===================================================== */

    if (message.type === "DARE_REJECTED") {

        console.log(
            "[DARE OVERLAY] Dare rejected:",
            message.dare
        );

        /*
         * Normally this won't be visible because
         * rejected dares were never active.
         */

        return;
    }


    /* =====================================================
       COMPLETED
    ===================================================== */

    if (message.type === "DARE_COMPLETED") {

        console.log(
            "[DARE OVERLAY] Dare completed:",
            message.dare
        );


        if (
            currentDare &&
            message.dare &&
            Number(currentDare.id) ===
            Number(message.dare.id)
        ) {

            showResult(
                "✅ DARE COMPLETED"
            );

        }

        return;
    }


    /* =====================================================
       FAILED
    ===================================================== */

    if (message.type === "DARE_FAILED") {

        console.log(
            "[DARE OVERLAY] Dare failed:",
            message.dare
        );


        if (
            currentDare &&
            message.dare &&
            Number(currentDare.id) ===
            Number(message.dare.id)
        ) {

            showResult(
                "🚫 DARE FAILED"
            );

        }

        return;
    }


    /* =====================================================
       ACTIVE CLEARED
    ===================================================== */

    if (message.type === "ACTIVE_DARE_CLEARED") {

        console.log(
            "[DARE OVERLAY] Active dare cleared."
        );

        hideOverlay();

        return;
    }


    /* =====================================================
       RESET
    ===================================================== */

    if (message.type === "RESET") {

        console.log(
            "[DARE OVERLAY] RESET"
        );

        hideOverlay();

        return;
    }

}


/* =========================================================
   SHOW DARE
========================================================= */

function showDare(dare) {

    if (!dare) {
        return;
    }


    console.log(
        "[DARE OVERLAY] SHOWING DARE:",
        dare
    );


    clearInterval(
        timerInterval
    );

    clearTimeout(
        resultTimeout
    );


    currentDare =
        dare;


    totalDuration =
        Number(dare.duration) || 30;


    remainingTime =
        totalDuration;


    /* -----------------------------------------------------
       VIEWER
    ----------------------------------------------------- */

    viewer.textContent =
        "@" +
        (
            dare.viewer ||
            "Anonymous"
        );


    /* -----------------------------------------------------
       DARE TEXT

       Supports both backend formats.
    ----------------------------------------------------- */

    dareText.textContent =
        dare.dareText ||
        dare.dare_text ||
        dare.text ||
        "Dare goes here";


    /* -----------------------------------------------------
       REWARD
    ----------------------------------------------------- */

    reward.textContent =
        Number(
            dare.reward || 0
        ).toFixed(2);


    /* -----------------------------------------------------
       DURATION
    ----------------------------------------------------- */

    duration.textContent =
        totalDuration;


    /* -----------------------------------------------------
       UI
    ----------------------------------------------------- */

    result.style.display =
        "none";


    timerContainer.style.display =
        "block";


    overlay.style.display =
        "block";


    status.textContent =
        "ACCEPTED";


    status.style.background =
        "#16a34a";


    /* -----------------------------------------------------
       TIMER
    ----------------------------------------------------- */

    updateTimer();

    startTimer();

}


/* =========================================================
   START TIMER
========================================================= */

function startTimer() {

    clearInterval(
        timerInterval
    );


    remainingTime =
        totalDuration;


    updateTimer();


    timerInterval =
        setInterval(
            function() {

                remainingTime--;

                updateTimer();


                if (
                    remainingTime <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    status.textContent =
                        "TIME'S UP";


                    status.style.background =
                        "#f59e0b";

                }

            },
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer() {

    timer.textContent =
        Math.max(
            remainingTime,
            0
        );


    const percentage =
        (
            remainingTime /
            totalDuration
        ) * 100;


    progress.style.width =
        Math.max(
            percentage,
            0
        ) + "%";

}


/* =========================================================
   RESULT
========================================================= */

function showResult(message) {

    clearInterval(
        timerInterval
    );


    timerContainer.style.display =
        "none";


    result.textContent =
        message;


    result.style.display =
        "block";


    overlay.style.display =
        "block";


    clearTimeout(
        resultTimeout
    );


    resultTimeout =
        setTimeout(
            function() {

                hideOverlay();

            },
            3000
        );

}


/* =========================================================
   HIDE
========================================================= */

function hideOverlay() {

    clearInterval(
        timerInterval
    );

    clearTimeout(
        resultTimeout
    );


    overlay.style.display =
        "none";


    currentDare =
        null;

}


/* =========================================================
   START
========================================================= */

connect();

</script>

</body>
</html>
